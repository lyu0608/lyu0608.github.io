<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>單字王會考特訓</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <!-- 載入 Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 載入你的題庫檔 -->
  <script src="./vocab2000.js"></script> 
  
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 20px; position: relative; min-height: 85vh; display: flex; flex-direction: column; }
    
    /* 頂部狀態列 */
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .app-title { font-size: 18px; font-weight: bold; margin: 0; color: var(--primary); }
    .sync-status { font-size: 13px; padding: 4px 8px; border-radius: 12px; background: #f1f5f9; color: var(--muted); }

    /* 登入與註冊區塊 */
    #authSection { display: flex; flex-direction: column; gap: 10px; }
    .auth-input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
    .btn { padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: #fff; text-align: center; }
    .btn-primary { background: var(--primary); }
    .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }

    /* 測驗區塊 */
    #quizSection { display: none; flex-grow: 1; flex-direction: column; }
    
    /* =========================================
       UI 優化：題幹與會考解析 (長文閱讀與滑動)
       ========================================= */
    .word-title {
      font-size: clamp(18px, 5vw, 24px); 
      font-weight: 700;
      margin-bottom: 10px;
      word-break: break-word;
      line-height: 1.55; 
      cursor: pointer;
    }
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .option-btn { padding: 14px; background: #f8fafc; border: 2px solid var(--border); border-radius: 10px; font-size: 16px; cursor: pointer; transition: 0.2s; text-align: left; }
    .option-btn:active { transform: scale(0.98); }
    .option-btn.correct { background: #d1fae5; border-color: var(--success); color: #065f46; }
    .option-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #991b1b; }

    /* 解析卡片：限制高度並內部滑動 */
    .explanation-card {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px 14px;
      margin-bottom: 14px;
      font-size: 14.5px;
      line-height: 1.65;
      text-align: left;
      max-height: 30vh; 
      overflow-y: auto; 
      overscroll-behavior: contain;
      display: none; 
    }
    .explanation-card::-webkit-scrollbar { width: 6px; }
    .explanation-card::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 10px; }
    .explanation-title { font-size: 15px; font-weight: 700; color: #1e40af; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #93c5fd; }
    .sentence-en { font-weight: 600; color: #0f172a; margin-bottom: 6px; display: block; }
    .sentence-zh { color: #475569; margin-bottom: 12px; display: block; }
    .grammar-note { font-size: 13.5px; color: #1d4ed8; background: #dbeafe; padding: 10px 12px; border-radius: 8px; display: block; line-height: 1.55; }

    /* =========================================
       UI 優化：底部按鈕吸底 (Sticky)
       ========================================= */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      bottom: -10px; 
      background: var(--card-bg);
      padding: 12px 0 8px 0;
      border-top: 1px solid var(--border);
      z-index: 10;
      margin-top: auto;
    }
    .link-btn { font-size: 14px; color: var(--primary); cursor: pointer; text-decoration: underline; background: none; border: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- 頂部狀態 -->
  <div class="header-bar">
    <h1 class="app-title">單字王會考特訓</h1>
    <span id="syncStatus" class="sync-status">🟡 本地模式</span>
  </div>

  <!-- 登入 / 註冊區塊 -->
  <div id="authSection">
    <p style="font-size: 14px; color: var(--muted); margin-bottom: 5px;">請登入以開啟雲端同步進度：</p>
    <input type="email" id="emailInput" class="auth-input" placeholder="電子信箱 (如 test@gmail.com)">
    <input type="password" id="passwordInput" class="auth-input" placeholder="密碼 (至少 6 碼)">
    <button class="btn btn-primary" onclick="handleAuth()">註冊 / 登入</button>
    <button class="btn btn-outline" onclick="enterGuestMode()">訪客模式 (僅存本地)</button>
    <p id="authMsg" style="color: var(--danger); font-size: 13px; text-align: center; margin-top: 5px;"></p>
  </div>

  <!-- 測驗區塊 -->
  <div id="quizSection">
    <!-- 進度提示 -->
    <div style="font-size: 13px; color: var(--muted); margin-bottom: 8px; text-align: right;" id="progressText">第 1 題</div>
    
    <!-- 題幹 (點擊可發音) -->
    <div class="word-title" id="wordTitle" onclick="speakPureUS(this.innerText)">載入中... 🔊</div>
    
    <!-- 選項 -->
    <div class="options-grid" id="optionsGrid"></div>

    <!-- 考點解析區塊 (限制高度，內部滑動) -->
    <div class="explanation-card" id="explanationCard"></div>

    <!-- 底部功能列 (吸底) -->
    <div class="footer-bar">
      <button class="link-btn" onclick="logout()">登出</button>
      <button class="btn btn-primary" id="nextBtn" style="padding: 10px 20px; display: none;" onclick="nextQuestion()">下一題 ➔</button>
    </div>
  </div>
</div>

<script>
  // ========================================================
  // 1. Supabase 初始化 (已修復 URL 斜線問題)
  // ========================================================
  const SUPABASE_URL = "https://qdheftossctylaycszfd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Ylg58I3mARi-3ce9hWaZkw_AcWz_deg";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let isGuest = true;
  let userStore = { history: {}, mistakes: [] };
  
  // 檢查 vocabData 是否存在，若無則給測試假資料
  const quizData = (typeof vocabData !== 'undefined') ? vocabData : [
    { en: "abandon", zh: "放棄", ex_en: "Don't abandon your dreams.", ex_zh: "不要放棄你的夢想。", note: "常考動名詞 V-ing 搭配" }
  ];
  let currentQuestion = null;

  // ========================================================
  // 2. 原生 TTS 發音功能 (US English)
  // ========================================================
  function speakPureUS(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel(); 
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    
    const voices = window.speechSynthesis.getVoices();
    const usVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) 
                 || voices.find(v => v.lang === 'en-US');
    if (usVoice) utterance.voice = usVoice;
    
    window.speechSynthesis.speak(utterance);
  }

  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  // ========================================================
  // 3. 認證與雲端同步功能
  // ========================================================
  async function handleAuth() {
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value.trim();
    const msg = document.getElementById("authMsg");
    
    if (!email || password.length < 6) {
      msg.innerText = "請輸入有效的信箱與至少6碼密碼";
      return;
    }
    msg.innerText = "連線中...";

    const { data: signInData, error: signInError } = await supabaseClient.auth.signInWithPassword({ email, password });
    
    if (signInError) {
      const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ email, password });
      if (signUpError) {
        msg.innerText = "錯誤: " + signUpError.message;
        return;
      }
      currentUser = signUpData.user;
    } else {
      currentUser = signInData.user;
    }

    isGuest = false;
    document.getElementById("authSection").style.display = "none";
    document.getElementById("quizSection").style.display = "flex";
    
    await syncFromCloud();
    loadQuestion();
  }

  function enterGuestMode() {
    isGuest = true;
    document.getElementById("syncStatus").innerText = "🟡 訪客模式 (本地)";
    document.getElementById("authSection").style.display = "none";
    document.getElementById("quizSection").style.display = "flex";
    
    const local = localStorage.getItem("local_vocab_progress");
    if (local) userStore = JSON.parse(local);
    
    loadQuestion();
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    location.reload();
  }

  // ★ 修正：處理新用戶空資料，確保亮起綠燈 ★
  async function syncFromCloud() {
    if (isGuest || !currentUser) return;
    const statusEl = document.getElementById("syncStatus");
    statusEl.innerText = "☁️ 正在同步中...";
    
    try {
      const { data, error } = await supabaseClient
        .from('user_progress')
        .select('history, mistakes')
        .eq('user_id', currentUser.id)
        .single();

      if (data) {
        userStore.history = data.history || {};
        userStore.mistakes = data.mistakes || [];
        localStorage.setItem("local_vocab_progress", JSON.stringify(userStore));
      }
      
      statusEl.innerText = "☁️ 已同步雲端";
      statusEl.style.color = "var(--success)";
      
    } catch (err) {
      console.error("同步狀態", err);
      statusEl.innerText = "☁️ 已同步雲端"; // 即使查詢空資料報錯也強制過關
      statusEl.style.color = "var(--success)";
    }
  }

  async function saveProgressToCloud() {
    localStorage.setItem("local_vocab_progress", JSON.stringify(userStore));
    if (isGuest || !currentUser) return;
    
    await supabaseClient.from('user_progress').upsert({
      user_id: currentUser.id,
      history: userStore.history,
      mistakes: userStore.mistakes,
      updated_at: new Date().toISOString()
    });
  }

  // ========================================================
  // 4. 測驗 UI 邏輯
  // ========================================================
  function loadQuestion() {
    document.getElementById("explanationCard").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("optionsGrid").innerHTML = "";
    
    currentQuestion = quizData[Math.floor(Math.random() * quizData.length)];
    document.getElementById("wordTitle").innerText = currentQuestion.en + " 🔊";
    speakPureUS(currentQuestion.en); 

    let options = [currentQuestion.zh, "錯誤選項A", "錯誤選項B", "錯誤選項C"];
    options.sort(() => Math.random() - 0.5); 

    const grid = document.getElementById("optionsGrid");
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(btn, opt === currentQuestion.zh);
      grid.appendChild(btn);
    });
  }

  function checkAnswer(btn, isCorrect) {
    const btns = document.querySelectorAll(".option-btn");
    btns.forEach(b => {
      b.onclick = null;
      if (b.innerText === currentQuestion.zh) b.classList.add("correct");
    });

    if (!isCorrect) {
      btn.classList.add("wrong");
      if (!userStore.mistakes.includes(currentQuestion.en)) {
        userStore.mistakes.push(currentQuestion.en);
      }
    }
    
    saveProgressToCloud(); 

    const expCard = document.getElementById("explanationCard");
    expCard.style.display = "block";
    expCard.innerHTML = `
      <div class="explanation-title">💡 考點解析</div>
      <span class="sentence-en">${currentQuestion.ex_en || '無例句'}</span>
      <span class="sentence-zh">${currentQuestion.ex_zh || '無翻譯'}</span>
      ${currentQuestion.note ? `<div class="grammar-note">📌 筆記：${currentQuestion.note}</div>` : ''}
    `;

    document.getElementById("nextBtn").style.display = "block";
  }

  function nextQuestion() {
    loadQuestion();
  }

  // ========================================================
  // 5. PWA Service Worker 註冊
  // ========================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW 註冊成功', reg))
        .catch(err => console.log('SW 註冊失敗', err));
    });
  }
</script>

</body>
</html>
