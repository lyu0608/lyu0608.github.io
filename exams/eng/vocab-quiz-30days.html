<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>英語單字特訓 App (純淨美音聽力與會考真題版)</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="vocab2000.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --purple: #7c3aed;
      --purple-hover: #6d28d9;
      --amber: #d97706;
      --cyan: #0891b2;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(8px, 2vw, 20px);
      padding-top: env(safe-area-inset-top, 12px);
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    .container {
      width: 100%;
      max-width: 680px;
      height: 100%;
      max-height: 96vh;
      max-height: 96dvh;
      background: var(--card-bg);
      border-radius: clamp(12px, 2.5vw, 20px);
      box-shadow: 0 4px 25px -4px rgba(0, 0, 0, 0.06);
      padding: clamp(12px, 2.5vw, 20px);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
    }

    .hidden { display: none !important; }

    .top-utility-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
      font-size: clamp(11px, 2vw, 13px);
      flex-shrink: 0;
    }
    .status-badge { font-weight: 600; color: #334155; }
    .cloud-badge { color: #0284c7; font-weight: 600; }
    .changelog-btn {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }

    .app-install-banner {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1.5px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .install-banner-text {
      font-size: 13px;
      font-weight: 700;
      color: #1e40af;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .install-banner-text span {
      font-size: 11.5px;
      font-weight: 500;
      color: #3b82f6;
    }
    .install-guide-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .auth-box { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
    .auth-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 4px; }
    .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: 600; color: var(--muted); }
    .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .input-group input { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; outline: none; }
    .input-group input:focus { border-color: var(--primary); }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.05s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:hover:not(:disabled) { background: var(--primary-hover); }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }

    .btn-danger { background: var(--danger); color: #fff; }
    .btn-guest {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .divider { display: flex; align-items: center; text-align: center; color: var(--muted); font-size: 12px; margin: 2px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .user-badge {
      font-weight: 700;
      color: var(--primary);
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #eff6ff;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .admin-badge-btn {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .logout-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; text-decoration: underline; }

    .quiz-type-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .quiz-type-btn {
      padding: clamp(6px, 1.2vw, 9px) 2px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--muted);
      font-size: clamp(11px, 2.2vw, 13px);
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .quiz-type-btn.active { background: #eff6ff; border-color: var(--primary); color: var(--primary); }
    .quiz-type-btn.exam-active { background: #fef3c7; border-color: var(--amber); color: #b45309; }
    .quiz-type-btn.listen-active { background: #ecfeff; border-color: var(--cyan); color: #0e7490; }

    .random-panel {
      background: #faf5ff;
      border: 1px solid #e9d5ff;
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
    }
    .random-title { font-size: 12px; font-weight: 700; color: #6b21a8; }
    .random-btn-group { display: flex; gap: 6px; }
    .random-btn {
      background: #fff;
      color: var(--purple);
      border: 1px solid #d8b4fe;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .random-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }

    .filter-panel {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .filter-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
    select {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
      outline: none;
      cursor: pointer;
    }

    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-shrink: 0; }
    .stats-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; flex-shrink: 0; }
    .progress-bar { width: 100%; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 10px; flex-shrink: 0; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s ease; }

    .word-card {
      background: #f8fafc;
      border: 1px dashed var(--border);
      border-radius: 14px;
      text-align: center;
      padding: 12px 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .exam-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .exam-tag.listen-tag { background: #ecfeff; color: #0e7490; border-color: #a5f3fc; }
    .word-title {
      font-size: clamp(17px, 4.5vw, 24px);
      font-weight: 800;
      margin-bottom: 4px;
      word-break: break-word;
      line-height: 1.45;
    }

    .audio-player-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: 8px 0;
    }
    .listen-btn-main {
      background: #0891b2;
      color: #fff;
      border: none;
      padding: 9px 22px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(8, 145, 178, 0.2);
    }
    .listen-btn-main:active { transform: scale(0.97); }

    .cloze-blank {
      display: inline-block;
      min-width: 60px;
      border-bottom: 2.5px solid var(--primary);
      color: var(--primary);
      padding: 0 4px;
      font-weight: 800;
    }
    .cloze-translation-hint {
      font-size: 13px;
      color: #166534;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 6px 10px;
      margin-top: 8px;
      font-weight: 600;
      line-height: 1.4;
    }
    .word-kk { font-size: 13px; color: #64748b; margin-bottom: 6px; }
    .sound-btn {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      cursor: pointer;
      color: var(--primary);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .options-grid { display: grid; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
    .option-btn {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      min-height: 46px;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: clamp(14px, 2.5vw, 15.5px);
      cursor: pointer;
      text-align: left;
      transition: all 0.12s;
    }
    .option-btn:active { transform: scale(0.98); }
    .opt-key {
      width: 22px;
      height: 22px;
      background: #f1f5f9;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-right: 10px;
      flex-shrink: 0;
    }
    .option-btn.correct { border-color: var(--success); background: var(--success-bg); color: #14532d; font-weight: 700; }
    .option-btn.wrong { border-color: var(--danger); background: var(--danger-bg); color: #7f1d1d; }

    .explanation-card {
      background: #eff6ff;
      border: 1.5px dashed #bfdbfe;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: clamp(12.5px, 2.2vw, 14px);
      line-height: 1.55;
      text-align: left;
      min-height: 110px;
      max-height: 24vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .explanation-card.placeholder {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #94a3b8;
      align-items: center;
      font-style: italic;
    }
    .explanation-card::-webkit-scrollbar { width: 5px; }
    .explanation-card::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 10px; }
    .explanation-title { font-size: 13.5px; font-weight: 700; color: #1e40af; margin-bottom: 6px; border-bottom: 1px dashed #bfdbfe; padding-bottom: 4px; }
    .sentence-en { font-weight: 600; color: #0f172a; margin-bottom: 4px; display: block; line-height: 1.45; }
    .sentence-zh { color: #475569; margin-bottom: 6px; display: block; line-height: 1.45; }
    .grammar-note { font-size: 12px; color: #1d4ed8; background: #dbeafe; padding: 5px 8px; border-radius: 6px; display: block; line-height: 1.4; }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      bottom: -6px;
      background: var(--card-bg);
      padding: 8px 0 4px 0;
      border-top: 1px solid var(--border);
      z-index: 10;
      margin-top: auto;
      flex-shrink: 0;
    }
    .link-btn { font-size: 12.5px; color: var(--muted); cursor: pointer; text-decoration: underline; }
    .hint-keyboard { font-size: 11.5px; color: var(--muted); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(3px);
      display: flex; justify-content: center; align-items: center;
      z-index: 999; padding: 16px;
    }
    .modal-card {
      width: 100%; max-width: 540px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 20px 18px;
      max-height: 85vh;
      display: flex; flex-direction: column;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 16px; font-weight: 700; color: #0f172a; }
    .modal-close { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; }
    .modal-body { overflow-y: auto; padding-top: 14px; font-size: 13px; line-height: 1.6; }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 8px;
      min-width: 480px;
    }
    .admin-table th, .admin-table td {
      border: 1px solid var(--border);
      padding: 8px 6px;
      text-align: center;
    }
    .admin-table th { background: #f8fafc; color: #334155; font-weight: 700; }
    .admin-table tr:nth-child(even) { background: #fbfcfe; }

    .account-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s;
    }
    .account-item:hover { border-color: var(--primary); background: #eff6ff; }
    .account-item.active { border-color: var(--primary); background: #dbeafe; font-weight: 700; }
    .account-avatar {
      width: 32px; height: 32px; background: var(--primary); color: #fff;
      border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; margin-right: 10px;
    }

    .install-step-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .install-step-title { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; color: #0f172a; }
    .install-step-card ol { margin-left: 20px; color: #334155; }
    .install-step-card li { margin-bottom: 6px; }
    .history-item { margin-bottom: 16px; border-left: 3px solid var(--primary); padding-left: 10px; }
    .history-tag { font-weight: 700; color: var(--primary); font-size: 13.5px; margin-bottom: 2px; }
    .history-desc { color: #334155; }
    .history-desc ul { margin-left: 16px; margin-top: 4px; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-utility-bar">
    <span class="status-badge" id="sourceStatus">🟡 題庫檢測中...</span>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="cloud-badge" id="syncStatus">☁️ 本地模式</span>
      <button class="changelog-btn" onclick="toggleChangelogModal(true)">🛠️ 維護紀錄</button>
    </div>
  </div>

  <div id="authSection" class="auth-box">
    <div class="app-install-banner">
      <div class="install-banner-text">
        📲 安裝為桌面 App (支援離線)
        <span>一鍵加入手機主畫面，全螢幕無干擾背單字</span>
      </div>
      <button class="install-guide-btn" onclick="toggleInstallModal(true)">安裝指引</button>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">學員登入</div>
      <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">註冊帳號</div>
    </div>
    <div class="input-group">
      <label>電子信箱 (Email)</label>
      <input type="email" id="authEmail" placeholder="student@example.com" autocomplete="email">
    </div>
    <div class="input-group">
      <label>密碼</label>
      <input type="password" id="authPassword" placeholder="至少 6 位數密碼" autocomplete="current-password">
    </div>
    <div class="input-group hidden" id="confirmPasswordGroup">
      <label>確認密碼</label>
      <input type="password" id="authPasswordConfirm" placeholder="請再次輸入密碼" autocomplete="new-password">
    </div>

    <button class="btn" id="authSubmitBtn" onclick="handleSupabaseAuth()">登入並同步進度</button>
    <div class="divider">或</div>
    <button class="btn-guest" onclick="loginAsGuest()">以訪客免登入模式體驗</button>
  </div>

  <div id="quizSection" class="hidden">
    <div class="user-header">
      <div style="display:flex; align-items:center; gap:6px;">
        <span class="user-badge" id="displayUsername" onclick="openSwitchAccountModal()">👤 學員 ▾</span>
        <button id="adminPanelBtn" class="admin-badge-btn hidden" onclick="openAdminDashboardModal()">👑 後台監控</button>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="link-btn" onclick="openSwitchAccountModal()" style="color:var(--primary); font-weight:600;">👥 切換</span>
        <span class="link-btn" onclick="toggleHistory()">成果</span>
        <span class="link-btn" onclick="promptClearRecords()" style="color:var(--danger);">清空</span>
        <button class="logout-btn" onclick="handleLogout()">登出</button>
      </div>
    </div>

    <div class="quiz-type-selector">
      <button class="quiz-type-btn active" id="typeWordDefBtn" onclick="setQuizType('wordDef')">🔤 單字識義</button>
