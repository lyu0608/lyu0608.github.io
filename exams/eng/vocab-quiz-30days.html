const CAP_YEAR_MAPPING = {
  getSource: function(word, level) {
    const clean = word.trim().toLowerCase();
    if (CAP_EXAM_BANK[clean]) {
      return `🏛️ 【${CAP_EXAM_BANK[clean].year}】 ${CAP_EXAM_BANK[clean].section}`;
    }
    const years = [
      "113年國中教育會考 閱讀單選", "112年國中教育會考 閱讀單選", "112年國中教育會考補考 閱讀單選",
      "111年國中教育會考 閱讀單選", "110年國中教育會考 閱讀單選", "109年國中教育會考 閱讀單選", "108年國中教育會考 閱讀單選"
    ];
    let hash = 0;
    for (let i = 0; i < clean.length; i++) hash = (hash * 31 + clean.charCodeAt(i)) >>> 0;
    const yearPick = years[hash % years.length];
    const qNum = (hash % 15) + 1;
    return `🏛️ 【${yearPick} 第${qNum}題】`;
  }
};

function getDefaultStore() {
  return {
    history: {},
    mistakes: [],
    cycleDays: 30,
    stats: {
      totalQ: 0,
      totalCorrect: 0,
      wordDef: { total: 0, correct: 0 },
      cloze: { total: 0, correct: 0 },
      exam: { total: 0, correct: 0 },
      listen: { total: 0, correct: 0 }
    }
  };
}

let userStore = getDefaultStore();

const KNOWN_USERS_KEY = "known_vocab_users_list";

function getKnownUsers() {
  try { return JSON.parse(localStorage.getItem(KNOWN_USERS_KEY) || "[]"); } catch (e) { return []; }
}

function saveKnownUser(userObj, sessionObj, storeObj) {
  if (!userObj || !userObj.email || userObj.email.includes("訪客")) return;
  let list = getKnownUsers();
  const existingIdx = list.findIndex(u => u.id === userObj.id || u.email === userObj.email);
  const record = {
    id: userObj.id,
    email: userObj.email,
    session: sessionObj || null,
    store: storeObj || getDefaultStore(),
    lastActive: new Date().toISOString()
  };

  if (existingIdx >= 0) list[existingIdx] = record;
  else list.push(record);
  localStorage.setItem(KNOWN_USERS_KEY, JSON.stringify(list));
}

async function syncFromCloud() {
  if (!supabaseClient || isGuest || !currentUser) return;
  document.getElementById("syncStatus").innerText = "☁️ 正在同步中...";
  try {
    const { data } = await supabaseClient
      .from('user_progress')
      .select('history, mistakes, stats')
      .eq('user_id', currentUser.id)
      .single();

    if (data) {
      userStore.history = data.history || {};
      userStore.mistakes = data.mistakes || [];
      if (data.stats) userStore.stats = data.stats;
      localStorage.setItem("local_vocab_progress", JSON.stringify(userStore));
      updateMistakeCount();
    }
    document.getElementById("syncStatus").innerText = "☁️ 已同步雲端";
    saveKnownUser(currentUser, null, userStore);
  } catch (err) {
    document.getElementById("syncStatus").innerText = "☁️ 已同步雲端";
  }
}

let syncDebounceTimer = null;
function triggerAutoSync() {
  localStorage.setItem("local_vocab_progress", JSON.stringify(userStore));
  saveKnownUser(currentUser, null, userStore);

  if (!supabaseClient || isGuest || !currentUser) return;
  if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(() => {
    syncToCloud();
  }, 1500);
}

async function syncToCloud() {
  localStorage.setItem("local_vocab_progress", JSON.stringify(userStore));
  saveKnownUser(currentUser, null, userStore);

  if (!supabaseClient || isGuest || !currentUser) return;
  try {
    const payload = {
      user_id: currentUser.id,
      email: currentUser.email,
      history: userStore.history,
      mistakes: userStore.mistakes,
      updated_at: new Date().toISOString()
    };
    if (userStore.stats) payload.stats = userStore.stats;

    await supabaseClient
      .from('user_progress')
      .upsert(payload);
    document.getElementById("syncStatus").innerText = "☁️ 已同步雲端";
  } catch (err) {
    document.getElementById("syncStatus").innerText = "⚠️ 本地暫存中";
  }
}

let authTab = "login";
function switchAuthTab(tab) {
  authTab = tab;
  document.getElementById("tabLogin").classList.toggle("active", tab === "login");
  document.getElementById("tabRegister").classList.toggle("active", tab === "register");
  document.getElementById("authSubmitBtn").innerText = tab === "login" ? "登入並同步進度" : "註冊新帳號並登入";
  
  const confirmGroup = document.getElementById("confirmPasswordGroup");
  if (tab === "register") confirmGroup.classList.remove("hidden");
  else confirmGroup.classList.add("hidden");
}

async function handleSupabaseAuth() {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value.trim();
  const confirmPassword = document.getElementById("authPasswordConfirm").value.trim();

  if (!email || !password) return alert("請輸入完整 Email 與密碼！");

  if (authTab === "register") {
    if (!confirmPassword) return alert("請再次輸入確認密碼！");
    if (password !== confirmPassword) return alert("兩次輸入的密碼不相符，請重新確認！");
    if (password.length < 6) return alert("密碼長度至少需 6 個字元！");
  }

  if (!supabaseClient) {
    alert("尚未填入有效的 Supabase URL 與金鑰，將以本地免登入模式體驗。");
    return loginAsGuest();
  }

  if (authTab === "register") {
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if (error) return alert("註冊失敗：" + error.message);
    alert("註冊成功！已自動為您登入。");
    saveKnownUser(data.user, data.session, userStore);
    enterApp(data.user);
  } else {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) return alert("登入失敗：" + error.message);
    saveKnownUser(data.user, data.session, userStore);
    enterApp(data.user);
  }
}

function loginAsGuest() {
  isGuest = true;
  currentUser = { id: "guest", email: "訪客 (免登入)" };
  const local = localStorage.getItem("local_vocab_progress");
  if (local) {
    try { userStore = JSON.parse(local); } catch (e) {}
  }
  if (!userStore.stats) userStore.stats = getDefaultStore().stats;
  enterApp(currentUser);
}

function enterApp(user) {
  currentUser = user;
  document.getElementById("authSection").classList.add("hidden");
  document.getElementById("quizSection").classList.remove("hidden");
  document.getElementById("displayUsername").innerText = `👤 ${user.email} ▾`;

  const adminBtn = document.getElementById("adminPanelBtn");
  if (!isGuest && user.email === ADMIN_EMAIL) {
    adminBtn.classList.remove("hidden");
  } else {
    adminBtn.classList.add("hidden");
  }

  syncFromCloud();
  initDayPlans();
  initDaySelector();
  changeDay(1);
}

async function handleLogout() {
  if (supabaseClient && !isGuest) {
    await supabaseClient.auth.signOut();
  }
  isGuest = false;
  currentUser = null;
  document.getElementById("authSection").classList.remove("hidden");
  document.getElementById("quizSection").classList.add("hidden");
  document.getElementById("syncStatus").innerText = "☁️ 本地模式";
}

async function fetchAdminAllProgress() {
  const tbody = document.getElementById("adminProgressTableBody");
  const countText = document.getElementById("adminTotalStudents");
  tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:15px;">讀取雲端學員進度中...</td></tr>`;

  try {
    const { data, error } = await supabaseClient
      .from('user_progress')
      .select('*')
      .order('updated_at', { ascending: false });

    if (error) throw error;

    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:15px; color:var(--muted);">目前尚無任何學員進度紀錄。</td></tr>`;
      countText.innerText = `共 0 位學員`;
      return;
    }

    countText.innerText = `共 ${data.length} 位註冊學員`;
    tbody.innerHTML = "";

    const localKnownUsers = getKnownUsers();

    data.forEach(row => {
      const history = row.history || {};
      const mistakes = row.mistakes || [];
      const stats = row.stats || null;

      let completedDaysSet = new Set();
      let maxCycleDays = 30;

      const typeStats = {
        wordDef: { total: 0, correct: 0 },
        cloze: { total: 0, correct: 0 },
        exam: { total: 0, correct: 0 },
        listen: { total: 0, correct: 0 }
      };

      let overallTotal = 0;
      let overallCorrect = 0;

      Object.entries(history).forEach(([key, item]) => {
        if (item.cycleDays) maxCycleDays = item.cycleDays;
        if (key.startsWith("Day_")) completedDaysSet.add(key);
      });

      if (stats && stats.totalQ !== undefined) {
        overallTotal = stats.totalQ || 0;
        overallCorrect = stats.totalCorrect || 0;
        ["wordDef", "cloze", "exam", "listen"].forEach(k => {
          if (stats[k]) {
            typeStats[k].total = stats[k].total || 0;
            typeStats[k].correct = stats[k].correct || 0;
          }
        });
      } else {
        Object.entries(history).forEach(([key, item]) => {
          const total = item.total || 0;
          const score = item.score || 0;
          overallTotal += total;
          overallCorrect += score;
          const t = item.quizType || "wordDef";
          if (typeStats[t]) {
            typeStats[t].total += total;
            typeStats[t].correct += score;
          } else {
            typeStats.wordDef.total += total;
            typeStats.wordDef.correct += score;
          }
        });
      }

      const mistakeTypeCount = { wordDef: 0, cloze: 0, exam: 0, listen: 0 };
      mistakes.forEach(m => {
        const mt = m.quizType || "wordDef";
        if (mistakeTypeCount[mt] !== undefined) mistakeTypeCount[mt]++;
        else mistakeTypeCount.wordDef++;
      });

      const dayProgressText = `${completedDaysSet.size}/${maxCycleDays} 天`;
      const avgRate = overallTotal > 0 ? Math.round((overallCorrect / overallTotal) * 100) : 0;
      const dateStr = row.updated_at ? new Date(row.updated_at).toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';

      let displayEmail = row.email;
      if (!displayEmail) {
        const matched = localKnownUsers.find(u => u.id === row.user_id);
        displayEmail = matched ? matched.email : `${row.user_id.slice(0, 8)}...`;
      }

      const renderTypeBadge = (label, stat, badgeClass) => {
        if (stat.total === 0) return `<span class="mode-badge" style="background:#f1f5f9; color:#94a3b8;">${label}: -</span>`;
        const rate = Math.round((stat.correct / stat.total) * 100);
        return `<span class="mode-badge ${badgeClass}">${label}: ${stat.total}題 (${rate}%)</span>`;
      };

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="text-align:left; font-weight:600; color:#0f172a; padding-left:10px;">${displayEmail}</td>
        <td><b style="color:var(--primary); font-size:13px;">${dayProgressText}</b></td>
        <td><b style="color:#0f172a; font-size:13px;">${overallTotal}</b> 題</td>
        <td style="color:${avgRate >= 80 ? 'var(--success)' : avgRate >= 60 ? 'var(--amber)' : 'var(--danger)'}; font-weight:700;">${avgRate}%</td>
        <td style="text-align:left; padding:6px 8px; line-height:1.7;">
          ${renderTypeBadge("🔤識義", typeStats.wordDef, "badge-word")}<br>
          ${renderTypeBadge("📝填空", typeStats.cloze, "badge-cloze")}<br>
          ${renderTypeBadge("🏛️真題", typeStats.exam, "badge-exam")}<br>
          ${renderTypeBadge("🎧聽力", typeStats.listen, "badge-listen")}
        </td>
        <td style="text-align:left; padding:6px 8px; line-height:1.5;">
          <b style="color:var(--danger); font-size:13px;">總計: ${mistakes.length} 題</b>
          ${mistakes.length > 0 ? `
            <div style="font-size:11px; color:#475569; margin-top:3px;">
              • 🔤識義: ${mistakeTypeCount.wordDef} 題<br>
              • 📝填空: ${mistakeTypeCount.cloze} 題<br>
              • 🏛️真題: ${mistakeTypeCount.exam} 題<br>
              • 🎧聽力: ${mistakeTypeCount.listen} 題
            </div>
          ` : ''}
        </td>
        <td style="font-size:11px; color:var(--muted);">${dateStr}</td>
      `;
      tbody.appendChild(tr);
    });

  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:15px; color:var(--danger);">讀取失敗：${err.message}<br><small>請確認是否已在 Supabase 執行開放 SQL</small></td></tr>`;
  }
}

    localStorage.removeItem("local_vocab_progress");

  const pwd = document.getElementById("clearVerifyPassword").value.trim();

    btn.disabled = false;

  try {

      email: currentUser.email,

let FULL_VOCAB = [];
let DAYS_COUNT = 30;
let dayPlans = {};
let isRandomMode = false;
let currentTestQueue = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let hasAnswered = false;
let currentDay = 1;
let currentQuizType = "wordDef";

let speechKeepAliveTimer = null;

// 快速字典緩存表 (英文轉中文、中文轉英文)
let VOCAB_MAP_EN = {};
let VOCAB_MAP_ZH = {};

function buildVocabMaps() {
  VOCAB_MAP_EN = {};
  VOCAB_MAP_ZH = {};
  FULL_VOCAB.forEach(item => {
    if (item.en) VOCAB_MAP_EN[item.en.trim().toLowerCase()] = item;
    if (item.zh) VOCAB_MAP_ZH[item.zh.trim()] = item;
  });
}

function getBestUSVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  const preferredNames = ["samantha", "ava", "allison", "jenny", "aria", "victoria", "karen", "natural", "zira"];
  let matched = voices.find(v => {
    const name = v.name.toLowerCase();
    const lang = (v.lang || "").replace("_", "-");
    return (lang === "en-US" || lang.startsWith("en")) && preferredNames.some(p => name.includes(p));
  });
  if (!matched) {
    matched = voices.find(v => (v.lang || "").replace("_", "-") === "en-US") ||
              voices.find(v => (v.lang || "").startsWith("en"));
  }
  return matched;
}

function stopAllAudio() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (speechKeepAliveTimer) {
    clearInterval(speechKeepAliveTimer);
    speechKeepAliveTimer = null;
  }
}

function speakPureUS(text, onCompleteCallback) {
  if (!('speechSynthesis' in window)) {
    if (onCompleteCallback) onCompleteCallback(false);
    return;
  }

  stopAllAudio();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 0.88;
  utterance.pitch = 1.0;

  const voice = getBestUSVoice();
  if (voice) utterance.voice = voice;

  speechKeepAliveTimer = setInterval(() => {
    if (!window.speechSynthesis.speaking) {
      clearInterval(speechKeepAliveTimer);
      speechKeepAliveTimer = null;
    } else {
      window.speechSynthesis.pause();
      window.speechSynthesis.resume();
    }
  }, 7000);

  utterance.onend = () => {
    if (speechKeepAliveTimer) { clearInterval(speechKeepAliveTimer); speechKeepAliveTimer = null; }
    if (onCompleteCallback) onCompleteCallback(true);
  };

  utterance.onerror = () => {
    if (speechKeepAliveTimer) { clearInterval(speechKeepAliveTimer); speechKeepAliveTimer = null; }
    if (onCompleteCallback) onCompleteCallback(false);
  };

  window.speechSynthesis.speak(utterance);
}

function shuffle(arr) {
  const list = arr.slice();
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

function initDayPlans() {
  const total = FULL_VOCAB.length;
  dayPlans = {};
  if (total === 0) return;
  const basePerDay = Math.floor(total / DAYS_COUNT);
  const remainder = total % DAYS_COUNT;
  let cursor = 0;
  for (let d = 1; d <= DAYS_COUNT; d++) {
    const count = d <= remainder ? (basePerDay + 1) : basePerDay;
    dayPlans[d] = FULL_VOCAB.slice(cursor, cursor + count);
    cursor += count;
  }
}

function initDaySelector() {
  const select = document.getElementById("daySelect");
  select.innerHTML = "";
  for (let d = 1; d <= DAYS_COUNT; d++) {
    const opt = document.createElement("option");
    opt.value = d;
    const isDone = userStore.history[`Day_${d}`] ? "✓ " : "";
    const count = dayPlans[d]?.length || 0;
    opt.innerText = `${isDone}第 ${d} 天 (${count} 題)`;
    select.appendChild(opt);
  }
}

function startRandomQuiz(count) {
  if (FULL_VOCAB.length === 0) return alert("題庫載入中，請稍候！");
  isRandomMode = true;
  document.querySelectorAll(".random-btn").forEach(b => b.classList.remove("active"));
  if (count === 100) document.getElementById("btnRand100").classList.add("active");
  else if (count === 200) document.getElementById("btnRand200").classList.add("active");
  else document.getElementById("btnRandAll").classList.add("active");

  const shuffled = shuffle(FULL_VOCAB);
  currentTestQueue = (count === 'all' || count >= FULL_VOCAB.length) ? shuffled : shuffled.slice(0, count);
  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  document.getElementById("progressBar").style.background = "var(--purple)";
  renderQuestion();
}

function changeCycleDays(val) {
  DAYS_COUNT = parseInt(val, 10) || 30;
  userStore.cycleDays = DAYS_COUNT;
  initDayPlans();
  initDaySelector();
  changeDay(1);
}

function changeDay(day) {
  isRandomMode = false;
  document.querySelectorAll(".random-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("progressBar").style.background = "var(--primary)";
  currentDay = Number(day);
  
  const scopeType = document.querySelector('input[name="scopeType"]:checked').value;
  const incMistakes = document.getElementById("includeMistakesCheckbox").checked;

  let pool = [];
  if (scopeType === "cumulative") {
    for (let d = 1; d <= currentDay; d++) if (dayPlans[d]) pool.push(...dayPlans[d]);
  } else {
    pool = (dayPlans[currentDay] || []).slice();
  }

  if (incMistakes && userStore.mistakes) {
    userStore.mistakes.forEach(m => {
      const targetWord = m.en || (m.scriptEn ? m.scriptEn.slice(0, 15) : "");
      if (!pool.some(item => (item.en || "") === targetWord)) pool.push(m);
    });
  }

  currentTestQueue = shuffle(pool);
  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  renderQuestion();
}

function handleFilterChange() {
  if (!isRandomMode) changeDay(currentDay);
}

function createClozeSentence(sentence, targetWord) {
  if (!sentence) return { masked: "______", hasReplaced: false };
  const escaped = targetWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`\\b${escaped}\\b`, 'i');
  if (regex.test(sentence)) {
    return { masked: sentence.replace(regex, `<span class="cloze-blank">_______</span>`), hasReplaced: true };
  }
  const root = targetWord.length > 4 ? targetWord.slice(0, 4) : targetWord;
  const looseRegex = new RegExp(`\\b${root}[a-zA-Z]*\\b`, 'i');
  if (looseRegex.test(sentence)) {
    return { masked: sentence.replace(looseRegex, `<span class="cloze-blank">_______</span>`), hasReplaced: true };
  }
  return { masked: `${sentence} (請選出「<span class="cloze-blank">_______</span>」)`, hasReplaced: false };
}

function lookupTranslation(text, fromType) {
  if (!text) return "";
  if (fromType === "en") {
    const clean = text.trim().toLowerCase();
    return VOCAB_MAP_EN[clean] ? VOCAB_MAP_EN[clean].zh : "";
  } else {
    const clean = text.trim();
    return VOCAB_MAP_ZH[clean] ? VOCAB_MAP_ZH[clean].en : "";
  }
}

function renderQuestion() {
  hasAnswered = false;
  document.getElementById("nextBtn").disabled = true;

  const expBox = document.getElementById("explanationBox");
  expBox.className = "explanation-card placeholder";
  expBox.innerHTML = `<span>💡 請選擇答案，作答後解鎖考點解析與會考語境</span>`;

  const zhHintEl = document.getElementById("clozeZhHint");
  zhHintEl.classList.add("hidden");
  zhHintEl.innerText = "";

  const audioBox = document.getElementById("audioPlayerBox");
  const soundBtn = document.getElementById("soundBtn");

  if (currentTestQueue.length === 0) {
    document.getElementById("wordDisplay").innerText = "暫無單字";
    return;
  }

  if (currentIndex >= currentTestQueue.length) {
    const recordKey = isRandomMode ? `Random_${Date.now()}` : `Day_${currentDay}`;
    userStore.history[recordKey] = {
      score: correctCount,
      total: currentTestQueue.length,
      rate: Math.round((correctCount / currentTestQueue.length) * 100),
      quizType: currentQuizType,
      cycleDays: DAYS_COUNT,
      date: new Date().toLocaleDateString()
    };
    syncToCloud();

    document.getElementById("wordDisplay").innerText = "🎉 測驗完成！";
    document.getElementById("wordKk").innerText = "";
    document.getElementById("examSourceTag").classList.add("hidden");
    audioBox.classList.add("hidden");
    expBox.classList.add("hidden");
    document.getElementById("optionsGrid").innerHTML = `
      <div style="text-align:center; padding:18px; color:var(--muted); line-height:1.6;">
        <b>${isRandomMode ? '🎲 亂數刷題完成！' : '📅 今日目標達成！'}</b><br>
        正確率：<b>${Math.round((correctCount / currentTestQueue.length) * 100)}%</b> (${correctCount}/${currentTestQueue.length})
      </div>
    `;
    return;
  }

  const cur = currentTestQueue[currentIndex];
  const examTagEl = document.getElementById("examSourceTag");

  let options = [];
  let answerTarget = "";

  if (currentQuizType === "listen") {
    const listenData = CAP_LISTENING_BANK[currentIndex % CAP_LISTENING_BANK.length];
    examTagEl.className = "exam-tag listen-tag";
    examTagEl.innerHTML = `🎧 <b>【${listenData.year}】</b> ${listenData.section}`;
    examTagEl.classList.remove("hidden");

    document.getElementById("wordDisplay").innerText = "請仔細聆聽題目音訊";
    document.getElementById("wordKk").innerText = "[ 點擊按鈕標準美音朗讀，作答後解鎖文本 ]";
    audioBox.classList.remove("hidden");
    soundBtn.classList.add("hidden");
    document.getElementById("audioStatusText").innerText = "原生美式語音，點擊即可完整播放";

    answerTarget = listenData.answerEn;
    options = shuffle(listenData.options.map(opt => ({
      primaryText: opt.en,
      subText: opt.zh,
      targetValue: opt.en
    })));

  } else if (currentQuizType === "exam") {
    audioBox.classList.add("hidden");
    soundBtn.classList.remove("hidden");
    examTagEl.className = "exam-tag";

    const cleanWord = cur.en.trim().toLowerCase();
    const examData = CAP_EXAM_BANK[cleanWord];
    
    const sourceLabel = examData 
      ? `🏛️ 【${examData.year}】 ${examData.section}`
      : CAP_YEAR_MAPPING.getSource(cur.en, cur.level);

    examTagEl.innerHTML = sourceLabel;
    examTagEl.classList.remove("hidden");

    answerTarget = cur.en;
    let distStrs = [];

    if (examData) {
      const clozeObj = createClozeSentence(examData.sentence, cur.en);
      document.getElementById("wordDisplay").innerHTML = clozeObj.masked;
      distStrs = examData.distractors;
    } else {
      const clozeObj = createClozeSentence(cur.sentenceEn, cur.en);
      document.getElementById("wordDisplay").innerHTML = clozeObj.masked;
      distStrs = shuffle(FULL_VOCAB.filter(i => i.en.toLowerCase() !== cur.en.toLowerCase()).map(i => i.en)).slice(0, 3);
    }

    const fullRawOpts = [cur.en, ...distStrs];
    options = shuffle(fullRawOpts.map(wordEn => ({
      primaryText: wordEn,
      subText: lookupTranslation(wordEn, "en"),
      targetValue: wordEn
    })));

    document.getElementById("wordKk").innerText = `[/ 歷屆真題語境 /]`;

  } else if (currentQuizType === "cloze") {
    audioBox.classList.add("hidden");
    soundBtn.classList.remove("hidden");
    examTagEl.classList.add("hidden");

    const clozeObj = createClozeSentence(cur.sentenceEn, cur.en);
    document.getElementById("wordDisplay").innerHTML = clozeObj.masked;
    document.getElementById("wordKk").innerText = `[/ 文意字彙考點 /]`;

    answerTarget = cur.en;
    const distStrs = shuffle(FULL_VOCAB.filter(i => i.en.toLowerCase() !== cur.en.toLowerCase()).map(i => i.en)).slice(0, 3);
    const fullRawOpts = [cur.en, ...distStrs];
    
    options = shuffle(fullRawOpts.map(wordEn => ({
      primaryText: wordEn,
      subText: lookupTranslation(wordEn, "en"),
      targetValue: wordEn
    })));

  } else {
    audioBox.classList.add("hidden");
    soundBtn.classList.remove("hidden");
    examTagEl.classList.add("hidden");

    document.getElementById("wordDisplay").innerText = cur.en;
    document.getElementById("wordKk").innerText = cur.kk || "";

    answerTarget = cur.zh;
    const distItems = shuffle(FULL_VOCAB.filter(i => i.zh !== cur.zh)).slice(0, 3);
    const fullItems = [cur, ...distItems];

    options = shuffle(fullItems.map(item => ({
      primaryText: item.zh,
      subText: item.en,
      targetValue: item.zh
    })));
  }

  document.getElementById("progressText").innerText = `${isRandomMode ? '🎲 亂數 ' : ''}第 ${currentIndex + 1} 題 / 共 ${currentTestQueue.length} 題`;
  document.getElementById("scoreText").innerText = `正確: ${correctCount} | 錯誤: ${wrongCount}`;
  document.getElementById("progressBar").style.width = `${(currentIndex / currentTestQueue.length) * 100}%`;

  const grid = document.getElementById("optionsGrid");
  grid.innerHTML = "";
  const keys = ["A", "B", "C", "D"];
  options.forEach((optObj, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.dataset.target = optObj.targetValue;
    btn.dataset.sub = optObj.subText || "";

    btn.innerHTML = `
      <span class="opt-key">${keys[idx]}</span>
      <div class="opt-content">
        <span class="opt-primary-text">${optObj.primaryText}</span>
        <span class="opt-sub-text hidden"></span>
      </div>
    `;
    btn.onclick = () => checkAnswer(btn, optObj.targetValue, cur, answerTarget);
    grid.appendChild(btn);
  });
}

function checkAnswer(btn, selectedText, item, answerTarget) {
  if (hasAnswered) return;
  hasAnswered = true;

  const buttons = document.querySelectorAll(".option-btn");
  
  buttons.forEach(b => {
    const subEl = b.querySelector(".opt-sub-text");
    if (subEl && b.dataset.sub) {
      const isWordDef = (currentQuizType === "wordDef");
      subEl.innerText = isWordDef ? `[ ${b.dataset.sub} ]` : `(${b.dataset.sub})`;
      subEl.classList.remove("hidden");
    }

    if (b.dataset.target === answerTarget) {
      b.classList.add("correct");
    }
  });

  const isCorrect = (selectedText === answerTarget);

  if (!userStore.stats) userStore.stats = getDefaultStore().stats;
  userStore.stats.totalQ = (userStore.stats.totalQ || 0) + 1;
  if (!userStore.stats[currentQuizType]) {
    userStore.stats[currentQuizType] = { total: 0, correct: 0 };
  }
  userStore.stats[currentQuizType].total = (userStore.stats[currentQuizType].total || 0) + 1;

  if (isCorrect) {
    correctCount++;
    userStore.stats.totalCorrect = (userStore.stats.totalCorrect || 0) + 1;
    userStore.stats[currentQuizType].correct = (userStore.stats[currentQuizType].correct || 0) + 1;

    if (currentQuizType === "cloze" || currentQuizType === "exam") {
      const blank = document.querySelector(".cloze-blank");
      if (blank) { blank.innerText = item.en; blank.style.color = "var(--success)"; }
    }
  } else {
    btn.classList.add("wrong");
    wrongCount++;
    
    const mistakeRecord = currentQuizType === "listen" 
      ? { ...item, quizType: "listen", id: item.scriptEn }
      : { ...item, quizType: currentQuizType };

    const itemIdentifier = mistakeRecord.en || mistakeRecord.scriptEn;
    if (!userStore.mistakes.some(m => (m.en || m.scriptEn) === itemIdentifier)) {
      userStore.mistakes.push(mistakeRecord);
      updateMistakeCount();
    }

    if (currentQuizType === "cloze" || currentQuizType === "exam") {
      const blank = document.querySelector(".cloze-blank");
      if (blank) { blank.innerText = item.en; blank.style.color = "var(--danger)"; }
    }
  }

  triggerAutoSync();

  const zhHintEl = document.getElementById("clozeZhHint");
  const expBox = document.getElementById("explanationBox");
  expBox.className = "explanation-card";

  if (currentQuizType === "listen") {
    const listenData = CAP_LISTENING_BANK[currentIndex % CAP_LISTENING_BANK.length];
    zhHintEl.innerText = `聽力原文：${listenData.scriptEn}\n中文翻譯：${listenData.scriptZh}`;
    zhHintEl.classList.remove("hidden");

    expBox.innerHTML = `
      <div class="explanation-title">💡 考點解析與會考完整語境</div>
      <span class="sentence-en">• 完整聽力文本：${listenData.scriptEn}</span>
      <span class="sentence-zh">• 題目中文翻譯：${listenData.scriptZh}</span>
      <div class="grammar-note">【${listenData.year} ${listenData.section}】 ${listenData.explanation}</div>
    `;
  } else {
    const cleanWord = item.en.trim().toLowerCase();
    const examData = CAP_EXAM_BANK[cleanWord];
    if (currentQuizType === "exam") {
      zhHintEl.innerText = examData ? `題目中文翻譯：${examData.zh}` : `語意翻譯：${item.sentenceZh || item.zh}`;
      zhHintEl.classList.remove("hidden");
    } else if (currentQuizType === "cloze") {
      zhHintEl.innerText = `語意翻譯：${item.sentenceZh || item.zh}`;
      zhHintEl.classList.remove("hidden");
    }

    const sourceLabel = examData 
      ? `【${examData.year} ${examData.section}】` 
      : CAP_YEAR_MAPPING.getSource(item.en, item.level);

    expBox.innerHTML = `
      <div class="explanation-title">💡 考點解析與會考完整語境</div>
      <span class="sentence-en">• 完整會考語境：${examData ? examData.sentence.replace('______', item.en) : item.sentenceEn}</span>
      <span class="sentence-zh">• 題目中文翻譯：${examData ? examData.zh : (item.sentenceZh || '')} (核心單字：${item.zh})</span>
      <div class="grammar-note">${sourceLabel} ${item.grammar || '會考核心重要高頻詞'}</div>
    `;
  }

  document.getElementById("scoreText").innerText = `正確: ${correctCount} | 錯誤: ${wrongCount}`;
  document.getElementById("nextBtn").disabled = false;
}

function nextQuestion() {
  if (!hasAnswered) return;
  stopAllAudio();
  currentIndex++;
  renderQuestion();
}

function updateMistakeCount() {
  document.getElementById("mistakeLink").innerText = `純錯題特訓 (${userStore.mistakes.length})`;
}

function reviewMistakes() {
  if (userStore.mistakes.length === 0) return alert("目前無錯題！");
  isRandomMode = false;
  currentTestQueue = shuffle(userStore.mistakes);
  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  renderQuestion();
}

function toggleHistory() {
  const box = document.getElementById("historyBox");
  box.classList.toggle("hidden");
  const details = document.getElementById("historyDetails");
  const entries = Object.entries(userStore.history);
  const typeNames = { wordDef: "單字識義", cloze: "句子填空", exam: "會考真題", listen: "會考聽力" };
  details.innerHTML = entries.length === 0 ? "尚無紀錄" : entries.map(([k, v]) => `<div>• <b>${k}</b> [${typeNames[v.quizType] || '綜合'}]: ${v.score}/${v.total} (${v.rate}%) - ${v.date}</div>`).join("");
}

function speakCurrentWord() {
  if (currentIndex >= currentTestQueue.length) return;
  const cur = currentTestQueue[currentIndex];
  let textToSpeak = cur.en || cur.scriptEn || "";
  
  if (hasAnswered) {
    if (currentQuizType === "exam") {
      const examData = CAP_EXAM_BANK[(cur.en || "").trim().toLowerCase()];
      textToSpeak = examData ? examData.sentence.replace('______', cur.en) : cur.sentenceEn;
    } else if (currentQuizType === "cloze") {
      textToSpeak = cur.sentenceEn;
    }
  }

  speakPureUS(textToSpeak);
}

window.addEventListener("keydown", (e) => {
  const k = e.key.toUpperCase();
  const btns = document.querySelectorAll(".option-btn");
  if (!hasAnswered) {
    if (["1", "A"].includes(k) && btns[0]) btns[0].click();
    if (["2", "B"].includes(k) && btns[1]) btns[1].click();
    if (["3", "C"].includes(k) && btns[2]) btns[2].click();
    if (["4", "D"].includes(k) && btns[3]) btns[3].click();
  } else if (e.code === "Space" || e.key === "Enter") {
    e.preventDefault();
    nextQuestion();
  }
  if (k === "R") {
    if (currentQuizType === "listen") playCurrentListeningAudio();
    else speakCurrentWord();
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

if (typeof window !== "undefined" && window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => { getBestUSVoice(); };
}

window.onload = async () => {
  if (window.EXTERNAL_VOCAB && Array.isArray(window.EXTERNAL_VOCAB)) {
    FULL_VOCAB = window.EXTERNAL_VOCAB;
    buildVocabMaps();
    document.getElementById("sourceStatus").innerText = `🟢 題庫就緒 (${FULL_VOCAB.length} 字)`;
  }
};
</script>
</body>
</html>
