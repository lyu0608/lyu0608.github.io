<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中 / 初中英語單字背誦測驗系統 (全量 2240 字)</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 660px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      padding: 24px;
      position: relative;
    }
    .hidden { display: none !important; }
    
    .top-utility-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
      font-size: 13px;
    }
    .status-badge {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }
    .util-links {
      display: flex;
      gap: 12px;
    }
    .util-link {
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .util-link:hover { color: var(--primary); }

    .auth-box { display: flex; flex-direction: column; gap: 14px; }
    .auth-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 10px; }
    .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: 600; color: var(--muted); }
    .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .input-group input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; }
    .input-group input:focus { border-color: var(--primary); }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 8px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }

    .btn-guest {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-guest:hover { background: #e2e8f0; }

    .user-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .user-badge { font-weight: 700; color: var(--primary); font-size: 15px; }
    .guest-tag { font-size: 11px; background: #e2e8f0; color: #475569; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: normal; }
    .logout-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; text-decoration: underline; }

    .filter-panel {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .filter-options {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .filter-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
      color: #334155;
    }
    .filter-label input { cursor: pointer; }

    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
    select { padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; background: #fff; cursor: pointer; outline: none; }
    .stats-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s ease; }

    .word-card { background: #f8fafc; border: 1px dashed var(--border); border-radius: 12px; text-align: center; padding: 18px 10px; margin-bottom: 16px; }
    .word-title { font-size: 34px; font-weight: 800; margin-bottom: 4px; }
    .word-kk { font-size: 15px; color: #475569; font-family: "Lucida Sans Unicode", "DejaVu Sans", sans-serif; margin-bottom: 10px; font-weight: 500; }
    .sound-btn { background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .sound-btn:hover { background: #f1f5f9; }

    .options-grid { display: grid; gap: 10px; margin-bottom: 16px; }
    .option-btn { display: flex; align-items: center; padding: 14px 16px; background: #fff; border: 2px solid var(--border); border-radius: 10px; font-size: 15px; cursor: pointer; text-align: left; transition: 0.15s; outline: none; }
    .option-btn:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
    .opt-key { width: 24px; height: 24px; background: #f1f5f9; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 12px; flex-shrink: 0; }
    .option-btn.correct { border-color: var(--success); background: var(--success-bg); color: #14532d; }
    .option-btn.wrong { border-color: var(--danger); background: var(--danger-bg); color: #7f1d1d; }

    .explanation-card {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 13.5px;
      line-height: 1.55;
    }
    .explanation-title { font-weight: 700; color: #1e40af; margin-bottom: 6px; }
    .sentence-en { font-weight: 600; color: #0f172a; margin-bottom: 2px; }
    .sentence-zh { color: #475569; margin-bottom: 6px; }
    .grammar-note { font-size: 12.5px; color: #1d4ed8; background: #dbeafe; padding: 4px 8px; border-radius: 6px; display: inline-block; }

    .btn { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .btn:hover:not(:disabled) { background: var(--primary-hover); }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .footer-bar { display: flex; justify-content: space-between; align-items: center; }
    .link-btn { font-size: 13px; color: var(--muted); cursor: pointer; text-decoration: underline; }
    .history-card { background: #f8fafc; border-radius: 10px; padding: 12px; margin-top: 15px; font-size: 13px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<div class="container">
  <div class="top-utility-bar">
    <span class="status-badge" id="sourceStatus">🟡 題庫狀態: 載入中...</span>
    <div class="util-links">
      <label class="util-link" title="手動載入 2240 字題庫">
        📁 載入 JSON
        <input type="file" id="jsonFileInput" accept=".json" style="display: none;" onchange="handleFileSelect(event)">
      </label>
    </div>
  </div>

  <!-- 登入與訪客入口 -->
  <div id="authSection" class="auth-box">
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">學員登入</div>
      <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">註冊帳號</div>
    </div>
    <div class="input-group">
      <label>學員帳號</label>
      <input type="text" id="authUsername" placeholder="請輸入學員名稱..." autocomplete="off">
    </div>
    <div class="input-group">
      <label>密碼</label>
      <input type="password" id="authPassword" placeholder="請輸入密碼..." autocomplete="off">
    </div>
    <button class="btn" id="authSubmitBtn" onclick="handleAuthSubmit()">開始學習</button>

    <div class="divider">或</div>
    <button class="btn-guest" onclick="loginAsGuest()">以訪客身分體驗 (匿名模式)</button>
  </div>

  <!-- 測驗操作主介面 -->
  <div id="quizSection" class="hidden">
    <div class="user-header">
      <span class="user-badge" id="displayUsername">👤 學員: </span>
      <div>
        <span class="link-btn" id="historyLink" onclick="toggleDashboard()" style="margin-right: 12px;">學習成果</span>
        <button class="logout-btn" onclick="logout()">登出</button>
      </div>
    </div>

    <!-- 週期天數選擇 (30/40/50/60天) 與滾動複習設置 -->
    <div class="filter-panel">
      <div class="filter-row">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span><b>背誦週期：</b></span>
          <select id="cycleDaysSelect" onchange="changeCycleDays(this.value)">
            <option value="30">30 天計畫</option>
            <option value="40">40 天計畫</option>
            <option value="50">50 天計畫</option>
            <option value="60">60 天計畫</option>
          </select>
        </div>
        <div class="filter-options">
          <label class="filter-label">
            <input type="radio" name="scopeType" value="todayOnly" checked onchange="handleFilterChange()">
            僅今日新單字
          </label>
          <label class="filter-label">
            <input type="radio" name="scopeType" value="cumulative" onchange="handleFilterChange()">
            滾動複習 (含以往進度)
          </label>
        </div>
      </div>
      <div class="filter-row" style="border-top: 1px dashed #cbd5e1; padding-top: 6px;">
        <label class="filter-label">
          <input type="checkbox" id="includeMistakesCheckbox" onchange="handleFilterChange()">
          <span>⚠️ 題目中混合加入「錯題本」加強複習</span>
        </label>
        <span class="link-btn" id="mistakeLink" onclick="reviewMistakes()">純錯題特訓 (0)</span>
      </div>
    </div>

    <div id="dashboardSection" class="history-card hidden">
      <strong id="dashboardTitle">📊 30 天完成進度：</strong>
      <div id="statsSummary" style="margin: 8px 0; max-height: 120px; overflow-y: auto;">尚無紀錄</div>
      <button class="btn" style="padding: 4px 10px; font-size: 12px;" onclick="toggleDashboard()">關閉面板</button>
    </div>

    <div class="controls">
      <select id="daySelect" onchange="changeDay(this.value)"></select>
      <span id="poolInfoText" style="font-size: 12px; color: var(--muted);">題庫共 0 題</span>
    </div>

    <div class="stats-info">
      <span id="progressText">第 1 題</span>
      <span id="scoreText">正確: 0 | 錯誤: 0</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressBar"></div>
    </div>

    <div class="word-card">
      <div class="word-title" id="wordDisplay">載入中...</div>
      <div class="word-kk" id="wordKk">[/.../]</div>
      <button class="sound-btn" onclick="speakCurrentWord()">🔊 聆聽發音</button>
    </div>

    <div class="options-grid" id="optionsGrid"></div>

    <div id="explanationBox" class="explanation-card hidden">
      <div class="explanation-title">💡 重點解析與例句</div>
      <div class="sentence-en" id="expSentenceEn"></div>
      <div class="sentence-zh" id="expSentenceZh"></div>
      <div class="grammar-note" id="expGrammar"></div>
    </div>

    <div class="footer-bar">
      <span style="font-size: 12px; color: var(--muted);">鍵盤捷徑: 1-4 / A-D</span>
      <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>下一題 (Space)</button>
    </div>
  </div>
</div>

<script>
function safeHash(str) {
  return encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1));
}

let FULL_VOCAB = [];
let DAYS_COUNT = 30;
let dayPlans = {};

// 載入外部或上傳之 JSON 題庫，全量接納
function applyNewVocabList(newList, sourceName) {
  if (!Array.isArray(newList) || newList.length === 0) return;
  FULL_VOCAB = newList.map(item => ({
    en: item.en || "",
    kk: item.kk || "",
    zh: item.zh || "",
    level: item.level || 1,
    sentenceEn: item.sentenceEn || `Example for "${item.en}".`,
    sentenceZh: item.sentenceZh || `單字「${item.en}」的範例例句。`,
    grammar: item.grammar || "核心單字"
  }));
  document.getElementById("sourceStatus").innerHTML = `🟢 題庫狀態: ${sourceName} (${FULL_VOCAB.length} 字)`;
  initDayPlans();
  initDaySelector();
  changeDay(1);
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data) && data.length > 0) {
        applyNewVocabList(data, "本機 JSON");
        alert(`成功載入！共讀取到 ${data.length} 個單字。`);
      }
    } catch (err) {
      alert("解析 JSON 失敗。");
    }
  };
  reader.readAsText(file);
}

function changeCycleDays(val) {
  DAYS_COUNT = parseInt(val, 10) || 30;
  document.getElementById("dashboardTitle").innerText = `📊 ${DAYS_COUNT} 天完成進度：`;
  initDayPlans();
  initDaySelector();
  changeDay(1);
}

// 精準均攤演算法：杜絕餘數誤差，平穩分配至每一天
function initDayPlans() {
  const total = FULL_VOCAB.length;
  dayPlans = {};
  
  if (total === 0) {
    for (let d = 1; d <= DAYS_COUNT; d++) dayPlans[d] = [];
    return;
  }

  const basePerDay = Math.floor(total / DAYS_COUNT);
  const remainder = total % DAYS_COUNT;

  let cursor = 0;
  for (let d = 1; d <= DAYS_COUNT; d++) {
    const count = d <= remainder ? (basePerDay + 1) : basePerDay;
    dayPlans[d] = FULL_VOCAB.slice(cursor, cursor + count);
    cursor += count;
  }
}

function shuffle(arr) {
  const list = arr.slice();
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

let currentUser = null;
let isGuest = false;
let guestData = { history: {}, mistakes: [] };
let authMode = "login";

function getUsersDB() {
  try { return JSON.parse(localStorage.getItem("vocab_users_db") || "{}"); } catch (e) { return {}; }
}
function saveUsersDB(db) {
  try { localStorage.setItem("vocab_users_db", JSON.stringify(db)); } catch (e) { alert("儲存空間不足！"); }
}

function switchAuthTab(mode) {
  authMode = mode;
  document.getElementById("tabLogin").classList.toggle("active", mode === "login");
  document.getElementById("tabRegister").classList.toggle("active", mode === "register");
  document.getElementById("authSubmitBtn").innerText = mode === "login" ? "開始學習" : "註冊並開始測驗";
}

function loginAsGuest() {
  isGuest = true;
  currentUser = "Guest";
  guestData = { history: {}, mistakes: [] };
  document.getElementById("authSection").classList.add("hidden");
  document.getElementById("quizSection").classList.remove("hidden");
  document.getElementById("displayUsername").innerHTML = `👤 訪客 <span class="guest-tag">匿名模式</span>`;
  initDayPlans();
  initDaySelector();
  changeDay(1);
  updateMistakeCount();
}

function handleAuthSubmit() {
  const u = document.getElementById("authUsername").value.trim();
  const p = document.getElementById("authPassword").value.trim();
  if (!u || !p) return alert("請輸入完整帳號與密碼！");

  const db = getUsersDB();
  if (authMode === "register") {
    if (db[u] || u.toLowerCase() === "guest") return alert("此帳號名稱已被使用！");
    db[u] = { password: safeHash(p), history: {}, mistakes: [] };
    saveUsersDB(db);
    alert("註冊成功！");
    loginSuccess(u);
  } else {
    if (!db[u] || db[u].password !== safeHash(p)) return alert("帳號不存在或密碼錯誤！");
    loginSuccess(u);
  }
}

function loginSuccess(u) {
  isGuest = false;
  currentUser = u;
  localStorage.setItem("vocab_active_session", u);
  document.getElementById("authSection").classList.add("hidden");
  document.getElementById("quizSection").classList.remove("hidden");
  document.getElementById("displayUsername").innerText = `👤 學員: ${currentUser}`;
  initDayPlans();
  initDaySelector();
  changeDay(1);
  updateMistakeCount();
}

function logout() {
  if (isGuest) {
    isGuest = false;
    currentUser = null;
    guestData = { history: {}, mistakes: [] };
  } else {
    localStorage.removeItem("vocab_active_session");
    currentUser = null;
  }
  document.getElementById("authSection").classList.remove("hidden");
  document.getElementById("quizSection").classList.add("hidden");
  document.getElementById("dashboardSection").classList.add("hidden");
  document.getElementById("authUsername").value = "";
  document.getElementById("authPassword").value = "";
}

function getUserData() {
  if (isGuest) return guestData;
  const db = getUsersDB();
  return (currentUser && db[currentUser]) ? db[currentUser] : { history: {}, mistakes: [] };
}

function saveUserData(data) {
  if (isGuest) { guestData = data; return; }
  if (!currentUser) return;
  const db = getUsersDB();
  db[currentUser] = data;
  saveUsersDB(db);
}

let currentTestQueue = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let hasAnswered = false;
let currentDay = 1;

function initDaySelector() {
  const select = document.getElementById("daySelect");
  select.innerHTML = "";
  const userData = getUserData();

  for (let d = 1; d <= DAYS_COUNT; d++) {
    const opt = document.createElement("option");
    opt.value = d;
    const isDone = userData.history[`Full_${DAYS_COUNT}D_Day_${d}`] ? "✓ " : "";
    const count = dayPlans[d]?.length || 0;
    opt.innerText = `${isDone}第 ${d} 天 (${count} 題)`;
    select.appendChild(opt);
  }
}

function buildQuestionPool(targetDay) {
  const scopeType = document.querySelector('input[name="scopeType"]:checked').value;
  const includeMistakes = document.getElementById("includeMistakesCheckbox").checked;
  const userData = getUserData();

  let pool = [];

  if (scopeType === "cumulative") {
    for (let d = 1; d <= targetDay; d++) {
      if (dayPlans[d]) pool.push(...dayPlans[d]);
    }
  } else {
    pool = (dayPlans[targetDay] || []).slice();
  }

  if (includeMistakes && userData.mistakes && userData.mistakes.length > 0) {
    userData.mistakes.forEach(m => {
      if (!pool.some(item => item.en === m.en)) pool.push(m);
    });
  }

  return pool;
}

function handleFilterChange() {
  changeDay(currentDay);
}

function changeDay(day) {
  currentDay = Number(day);
  const pool = buildQuestionPool(currentDay);
  document.getElementById("poolInfoText").innerText = `全量共 ${FULL_VOCAB.length} 字 (今日出題 ${pool.length} 題)`;
  
  currentTestQueue = shuffle(pool);
  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  renderQuestion();
}

function renderQuestion() {
  hasAnswered = false;
  document.getElementById("nextBtn").disabled = true;
  document.getElementById("explanationBox").classList.add("hidden");

  if (currentTestQueue.length === 0) {
    document.getElementById("wordDisplay").innerText = "此範圍無單字";
    document.getElementById("wordKk").innerText = "";
    document.getElementById("optionsGrid").innerHTML = "";
    return;
  }

  if (currentIndex >= currentTestQueue.length) {
    recordDayCompletion();
    document.getElementById("wordDisplay").innerText = "🎉 測驗完成！";
    document.getElementById("wordKk").innerText = "";
    document.getElementById("optionsGrid").innerHTML = `
      <div style="text-align: center; padding: 20px; font-size: 15px; color: var(--muted);">
        完成！正確率：<b>${Math.round((correctCount / currentTestQueue.length) * 100)}%</b><br>
        本次共完成 ${currentTestQueue.length} 題。
      </div>
    `;
    document.getElementById("progressText").innerText = "已完成所有題數";
    document.getElementById("progressBar").style.width = "100%";
    return;
  }

  const currentItem = currentTestQueue[currentIndex];
  document.getElementById("wordDisplay").innerText = currentItem.en;
  document.getElementById("wordKk").innerText = currentItem.kk || "";
  document.getElementById("progressText").innerText = `第 ${currentIndex + 1} 題 / 共 ${currentTestQueue.length} 題`;
  document.getElementById("scoreText").innerText = `正確: ${correctCount} | 錯誤: ${wrongCount}`;
  document.getElementById("progressBar").style.width = `${(currentIndex / currentTestQueue.length) * 100}%`;

  const distractors = shuffle(FULL_VOCAB.filter(i => i.zh !== currentItem.zh).map(i => i.zh)).slice(0, 3);
  const options = shuffle([currentItem.zh, ...distractors]);

  const grid = document.getElementById("optionsGrid");
  grid.innerHTML = "";
  const keys = ["A", "B", "C", "D"];

  options.forEach((optText, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="opt-key">${keys[idx]}</span><span>${optText}</span>`;
    btn.onclick = () => checkAnswer(btn, optText, currentItem);
    grid.appendChild(btn);
  });
}

function checkAnswer(btn, selectedText, item) {
  if (hasAnswered) return;
  hasAnswered = true;

  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => {
    if (b.querySelector("span:last-child").innerText === item.zh) {
      b.classList.add("correct");
    }
  });

  const userData = getUserData();
  if (selectedText === item.zh) {
    correctCount++;
  } else {
    btn.classList.add("wrong");
    wrongCount++;
    if (!userData.mistakes.some(m => m.en === item.en)) {
      userData.mistakes.push(item);
      saveUserData(userData);
      updateMistakeCount();
    }
  }

  if (item.sentenceEn) {
    document.getElementById("expSentenceEn").innerText = `• ${item.sentenceEn}`;
    document.getElementById("expSentenceZh").innerText = item.sentenceZh || "";
    document.getElementById("expGrammar").innerText = item.grammar || "核心實用單字";
    document.getElementById("explanationBox").classList.remove("hidden");
  }

  document.getElementById("scoreText").innerText = `正確: ${correctCount} | 錯誤: ${wrongCount}`;
  document.getElementById("nextBtn").disabled = false;
}

function nextQuestion() {
  if (!hasAnswered) return;
  currentIndex++;
  renderQuestion();
}

function recordDayCompletion() {
  const userData = getUserData();
  userData.history[`Full_${DAYS_COUNT}D_Day_${currentDay}`] = {
    accuracy: Math.round((correctCount / currentTestQueue.length) * 100),
    score: correctCount,
    total: currentTestQueue.length,
    date: new Date().toLocaleDateString()
  };
  saveUserData(userData);
  initDaySelector();
  document.getElementById("daySelect").value = currentDay;
}

function updateMistakeCount() {
  const userData = getUserData();
  document.getElementById("mistakeLink").innerText = `純錯題特訓 (${userData.mistakes.length})`;
}

function reviewMistakes() {
  const userData = getUserData();
  if (userData.mistakes.length === 0) return alert("目前無錯題！");
  if (confirm(`是否複習累積的 ${userData.mistakes.length} 道錯題？`)) {
    currentTestQueue = shuffle(userData.mistakes);
    currentIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    document.getElementById("poolInfoText").innerText = `錯題庫共 ${currentTestQueue.length} 題`;
    renderQuestion();
  }
}

function toggleDashboard() {
  const panel = document.getElementById("dashboardSection");
  panel.classList.toggle("hidden");
  if (!panel.classList.contains("hidden")) {
    const history = getUserData().history;
    const records = Object.entries(history);
    document.getElementById("statsSummary").innerHTML = records.length === 0
      ? "尚無完成記錄"
      : records.map(([key, d]) => `<div>• <b>${key}</b>: 正確率 ${d.accuracy}% (${d.score}/${d.total}) - ${d.date}</div>`).join("");
  }
}

// 雙軌發音模組
let currentAudio = null;
const audioUrlCache = new Map();

function playLocalSpeech(word) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "en-US";
  utterance.rate = 0.9;
  utterance.pitch = 1.05;

  const voices = window.speechSynthesis.getVoices();
  const femaleKeywords = ["samantha", "karen", "victoria", "ava", "allison", "susan", "zira", "jenny", "aria", "female"];
  let selectedVoice = voices.find(v => {
    const name = v.name.toLowerCase();
    const lang = (v.lang || "").replace("_", "-");
    return lang === "en-US" && femaleKeywords.some(k => name.includes(k));
  }) || voices.find(v => (v.lang || "").replace("_", "-") === "en-US");

  if (selectedVoice) utterance.voice = selectedVoice;
  window.speechSynthesis.speak(utterance);
}

async function speakCurrentWord() {
  if (currentIndex >= currentTestQueue.length) return;
  const word = currentTestQueue[currentIndex].en.trim().toLowerCase();

  if (audioUrlCache.has(word) && audioUrlCache.get(word)) {
    try {
      if (currentAudio) currentAudio.pause();
      currentAudio = new Audio(audioUrlCache.get(word));
      await currentAudio.play();
      return;
    } catch (e) {
      playLocalSpeech(word);
      return;
    }
  }

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 1800);
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`, {
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    if (res.ok) {
      const data = await res.json();
      let targetAudio = null;
      if (data && data[0] && Array.isArray(data[0].phonetics)) {
        const usItem = data[0].phonetics.find(p => p.audio && p.audio.includes("-us.mp3"));
        if (usItem && usItem.audio) targetAudio = usItem.audio;
        else {
          const anyItem = data[0].phonetics.find(p => p.audio && p.audio.trim() !== "");
          if (anyItem) targetAudio = anyItem.audio;
        }
      }
      if (targetAudio) {
        if (targetAudio.startsWith("//")) targetAudio = "https:" + targetAudio;
        audioUrlCache.set(word, targetAudio);
        if (currentAudio) currentAudio.pause();
        currentAudio = new Audio(targetAudio);
        await currentAudio.play();
        return;
      }
    }
  } catch (err) {}

  audioUrlCache.set(word, null);
  playLocalSpeech(word);
}

if (typeof window !== "undefined" && window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
}

window.addEventListener("keydown", (e) => {
  const k = e.key.toUpperCase();
  const btns = document.querySelectorAll(".option-btn");
  if (!hasAnswered) {
    if (["1", "A"].includes(k) && btns[0]) btns[0].click();
    if (["2", "B"].includes(k) && btns[1]) btns[1].click();
    if (["3", "C"].includes(k) && btns[2]) btns[2].click();
    if (["4", "D"].includes(k) && btns[3]) btns[3].click();
  } else if (e.code === "Space" || e.key === "Enter") {
    e.preventDefault();
    nextQuestion();
  }
});

window.onload = async () => {
  let loadedFromFetch = false;
  try {
    const res = await fetch("vocab2000.json");
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        applyNewVocabList(data, "伺服器 JSON");
        loadedFromFetch = true;
      }
    }
  } catch (err) {}

  if (!loadedFromFetch) {
    document.getElementById("sourceStatus").innerHTML = `🟡 題庫狀態: 請點擊右上角載入 vocab2000.json`;
  }

  const activeSession = localStorage.getItem("vocab_active_session");
  if (activeSession && getUsersDB()[activeSession]) {
    loginSuccess(activeSession);
  }
};
