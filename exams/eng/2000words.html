<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111316" media="(prefers-color-scheme: dark)">
<title>國中單字王 2000 練習</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="單字王">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f2937'/><text x='16' y='22' font-size='14' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>ABC</text></svg>">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --hover:#f1f3f5; --accent:#1f2937;
    --ok:#16a34a; --okbg:#ecfdf3; --bad:#dc2626; --badbg:#fef2f2; --warn:#d97706;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 8px rgba(0,0,0,.04);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#111316; --card:#1a1d21; --text:#e5e7eb; --muted:#9ca3af;
      --line:#2a2e34; --hover:#23272c; --accent:#e5e7eb;
      --ok:#4ade80; --okbg:#13251a; --bad:#f87171; --badbg:#2a1616; --warn:#fbbf24;
      --shadow:none; color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  .acct,.install{margin-bottom:14px}
  .install{font-size:14px}  .auth{display:grid; gap:8px; margin-top:10px}
  .amsg{font-size:13px; color:var(--muted); margin-top:8px}
  .amsg:empty{display:none}
  .amsg.bad{color:var(--bad)}
  .muted{color:var(--muted)}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-size:15px; line-height:1.5;
  }
  button{font:inherit; color:inherit}
  .wrap{max-width:900px; margin:0 auto; padding:36px 20px 64px}
  .back{display:inline-block; color:var(--muted); text-decoration:none; font-size:14px; margin-bottom:14px}
  .back:hover{color:var(--text)}
  header{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px}
  h1{font-size:26px; margin:0}
  .sub{color:var(--muted); margin:2px 0 0; font-size:14px}
  .stats{display:flex; gap:8px}
  .stats div{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 12px; text-align:center; min-width:72px}
  .stats b{display:block; font-size:18px; font-variant-numeric:tabular-nums}
  .stats span{font-size:12px; color:var(--muted)}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow)}
  .range{margin-bottom:14px}
  .range-top{display:flex; justify-content:space-between; gap:8px; font-size:14px; margin-bottom:10px}
  .label{font-weight:600}
  #rangeInfo{color:var(--muted)}
  .letters{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px}
  .letters button{
    min-width:32px; height:32px; padding:0 8px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); cursor:pointer; font-size:13px; font-weight:600;
  }
  .letters button:hover{background:var(--hover)}
  .letters button.on{background:var(--accent); color:var(--bg); border-color:var(--accent)}
  .range-row{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; font-size:14px}
  .range-row input[type=number]{width:84px; padding:7px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit}
  .chk{display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none}
  .chk input{width:16px; height:16px; accent-color:var(--accent); margin:0}

  .tabs{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--bg);
    display:flex; gap:4px; padding:8px 0; margin-bottom:10px;
  }
  .tabs button{
    flex:1; border:1px solid var(--line); background:var(--card); border-radius:10px;
    padding:10px 6px; cursor:pointer; font-size:15px; color:var(--muted);
  }
  .tabs button.on{background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600}
  .tabs .cnt{font-size:12px; opacity:.8}

  .btn{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:9px 16px; cursor:pointer; font-size:14px}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent); color:var(--bg); border-color:var(--accent)}
  .btn.primary:hover{opacity:.9}
  .btn.ok{border-color:var(--ok); color:var(--ok)}
  .btn.bad{border-color:var(--bad); color:var(--bad)}
  .btn:disabled{opacity:.4; cursor:default}
  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .empty{color:var(--muted); text-align:center; padding:28px 0}
  select,.inp{padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font:inherit; font-size:16px}
  .inp{width:100%; outline:none}
  .inp:focus,select:focus{border-color:var(--muted)}

  .say{border:0; background:none; cursor:pointer; padding:4px; border-radius:6px; color:var(--muted); display:inline-grid; place-items:center; flex:none}
  .say:hover{background:var(--hover); color:var(--text)}
  .say svg{width:18px; height:18px}

  /* 單字表 */
  .list-top{display:flex; gap:8px; align-items:center; margin-bottom:8px}
  .list-top .inp{flex:1}
  #listInfo{font-size:13px; color:var(--muted); white-space:nowrap}
  .words{list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .words li{display:grid; grid-template-columns:44px 28px minmax(0,1.2fr) 72px minmax(0,1.5fr) 32px; align-items:center; gap:6px; padding:7px 10px; border-top:1px solid var(--line)}
  .words li:first-child{border-top:0}
  .words .no{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .words .w{font-weight:600; overflow-wrap:anywhere}
  .words .pos{font-size:12px; color:var(--muted)}
  .words .m{overflow-wrap:anywhere}
  .star{border:0; background:none; cursor:pointer; font-size:18px; color:var(--line); padding:2px; border-radius:6px}
  .star.on{color:var(--warn)}
  .more{text-align:center; padding:12px}

  /* 字卡 */
  .opts{display:flex; flex-wrap:wrap; gap:8px 16px; font-size:14px; margin-bottom:10px}
  .fc{
    min-height:240px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    text-align:center; cursor:pointer; user-select:none; position:relative; padding:28px 16px;
  }
  .big{font-size:38px; font-weight:700; line-height:1.2; overflow-wrap:anywhere}
  .big.zh{font-size:30px; font-weight:600}
  .fc .pos{color:var(--muted); font-size:14px}
  .fc hr{width:60%; border:0; border-top:1px dashed var(--line); margin:10px 0}
  .tap{color:var(--muted); font-size:13px; margin-top:10px}
  .badges{position:absolute; top:10px; right:10px; display:flex; gap:4px}
  .badge{font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid}
  .badge.ok{color:var(--ok)} .badge.bad{color:var(--bad)}
  .fc-no{position:absolute; top:10px; left:12px; font-size:12px; color:var(--muted)}
  .fc-ctrl{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-top:10px}
  .fc-ctrl .btn{padding:12px 6px}
  .fc-nav{display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:14px; color:var(--muted)}
  .kbd-hint{font-size:12px; color:var(--muted); text-align:center; margin-top:10px}

  /* 測驗 */
  .setup{display:grid; gap:12px}
  .setup label{display:grid; gap:4px; font-size:14px}
  .q-top{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:6px}
  .q-bar{height:6px; background:var(--hover); border-radius:99px; overflow:hidden; margin-bottom:14px}
  .q-bar i{display:block; height:100%; background:var(--accent); transition:width .3s}
  .prompt{text-align:center; padding:16px 0 18px}
  .prompt .pos{color:var(--muted); font-size:14px; margin-top:4px}
  .hint{font-family:ui-monospace,Consolas,monospace; letter-spacing:.15em; color:var(--muted); margin-top:8px; font-size:18px}
  .listen-btn{width:88px; height:88px; border-radius:50%; border:1px solid var(--line); background:var(--bg); cursor:pointer; display:inline-grid; place-items:center}
  .listen-btn svg{width:40px; height:40px}
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .choice{border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:14px 10px; cursor:pointer; text-align:left; font-size:16px; display:flex; gap:8px; align-items:flex-start}
  .choice:hover{background:var(--hover)}
  .choice .k{font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 5px; margin-top:2px; flex:none}
  .choice.right{border-color:var(--ok); background:var(--okbg)}
  .choice.wrongc{border-color:var(--bad); background:var(--badbg)}
  .spell{display:flex; gap:8px}
  .spell .inp{flex:1; font-size:18px}
  .inp.right{border-color:var(--ok); background:var(--okbg)}
  .inp.wrongc{border-color:var(--bad); background:var(--badbg)}
  .fb{margin-top:12px; padding:10px 12px; border-radius:10px; font-size:15px}
  .fb:empty{display:none}
  .fb.ok{background:var(--okbg); color:var(--ok)}
  .fb.bad{background:var(--badbg); color:var(--text)}
  .fb.bad b{color:var(--bad)}
  .q-foot{display:flex; justify-content:space-between; gap:8px; margin-top:12px}
  .score{font-size:48px; font-weight:700; text-align:center; line-height:1.1}
  .score-sub{text-align:center; color:var(--muted); margin-bottom:14px}
  .mini{list-style:none; margin:10px 0 0; padding:0}
  .mini li{display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap}
  .mini .w{font-weight:600}
  .mini .pos{font-size:12px; color:var(--muted)}
  .mini .given{font-size:13px; color:var(--bad); text-decoration:line-through}
  .mini .cnt{margin-left:auto; font-size:12px; color:var(--muted)}
  .x{border:0; background:none; cursor:pointer; color:var(--muted); font-size:18px; padding:2px 8px; border-radius:6px}
  .x:hover{background:var(--hover); color:var(--bad)}
  .foot{color:var(--muted); font-size:12px; text-align:center; margin-top:28px}

  @media (max-width:600px){
    .wrap{padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
    h1{font-size:22px}
    .stats{width:100%} .stats div{flex:1}
    .letters{flex-wrap:nowrap; overflow-x:auto; margin:0 -16px 10px; padding:0 16px 4px; scrollbar-width:none}
    .letters button{flex:none; height:36px; min-width:36px}
    .range-row input[type=number]{font-size:16px; width:76px}
    .tabs{margin:0 -16px 10px; padding:8px 16px}
    .tabs button{font-size:14px; padding:10px 2px}
    .words li{grid-template-columns:28px minmax(0,1fr) 32px; grid-template-areas:"say w star" "say m star"; row-gap:0; padding:9px 10px}
    .words .no,.words .pos{display:none}
    .words .say{grid-area:say} .words .w{grid-area:w} .words .m{grid-area:m; font-size:14px; color:var(--muted)} .words .star{grid-area:star}
    .big{font-size:32px} .big.zh{font-size:26px}
    .fc{min-height:220px}
    .choices{grid-template-columns:1fr}
    .choice{padding:13px 12px}
    .kbd-hint{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← 回到常用網頁</a>
  <header>
    <div>
      <h1>國中單字王 2000</h1>
      <p class="sub">114 年版題庫・共 2000 字・點喇叭圖示聽發音</p>
    </div>
    <div class="stats">
      <div><b id="stTotal">2000</b><span>總字數</span></div>
      <div><b id="stKnown">0</b><span>已熟悉</span></div>
      <div><b id="stWrong">0</b><span>錯題</span></div>
    </div>
  </header>

  <section class="card install" id="installCard" hidden>
    <div class="row" style="justify-content:space-between">
      <span id="installText">把單字王安裝成 App，從主畫面一點就開，沒網路也能練習</span>
      <div class="row">
        <button class="btn primary" id="installBtn" hidden>安裝 App</button>
        <button class="x" id="installClose" aria-label="關閉">×</button>
      </div>
    </div>
  </section>

  <section class="card acct" id="acct" hidden>
    <div id="acctOut">
      <div class="row" style="justify-content:space-between">
        <span>登入後，手機和電腦的進度會自動同步</span>
        <button class="btn" id="acctToggle">登入／註冊</button>
      </div>
      <form class="auth" id="authForm" hidden>
        <input class="inp" id="aEmail" type="email" autocomplete="email" placeholder="Email" autocapitalize="off">
        <input class="inp" id="aPass" type="password" autocomplete="current-password" placeholder="密碼（至少 6 碼）">
        <div class="row">
          <button class="btn primary" type="submit">登入</button>
          <button class="btn" type="button" id="aSignup">註冊新帳號</button>
        </div>
      </form>
    </div>
    <div id="acctIn" class="row" style="justify-content:space-between" hidden>
      <span>已登入 <b id="aWho"></b>・<span id="aSync" class="muted"></span></span>
      <button class="btn" id="aLogout">登出</button>
    </div>
    <div class="amsg" id="aMsg"></div>
  </section>

  <section class="card range">
    <div class="range-top"><span class="label">練習範圍</span><span id="rangeInfo"></span></div>
    <div class="letters" id="letters"></div>
    <div class="range-row">
      <label>從 <input type="number" id="rFrom" min="1" max="2000" inputmode="numeric"></label>
      <label>到 <input type="number" id="rTo" min="1" max="2000" inputmode="numeric"></label>
      <label class="chk"><input type="checkbox" id="rWrong"> 只練錯題</label>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-t="list">單字表</button>
    <button data-t="cards">字卡</button>
    <button data-t="quiz">測驗</button>
    <button data-t="wrong">錯題本 <span class="cnt" id="tabWrong"></span></button>
  </nav>

  <!-- 單字表 -->
  <section id="t-list" hidden>
    <div class="list-top">
      <input class="inp" id="search" type="search" placeholder="搜尋英文或中文（搜尋全部 2000 字）" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <span id="listInfo"></span>
    </div>
    <ul class="words" id="wordList"></ul>
    <div class="more" id="moreWrap" hidden><button class="btn" id="moreBtn">顯示更多</button></div>
  </section>

  <!-- 字卡 -->
  <section id="t-cards" hidden>
    <div class="opts">
      <label class="chk"><input type="checkbox" id="fcShuffle"> 隨機順序</label>
      <label class="chk"><input type="checkbox" id="fcZh"> 先看中文</label>
      <label class="chk"><input type="checkbox" id="fcAuto" checked> 自動發音</label>
    </div>
    <div class="card fc" id="fcCard"></div>
    <div class="fc-ctrl">
      <button class="btn" id="fcPrev">← 上一張</button>
      <button class="btn bad" id="fcDont">不熟</button>
      <button class="btn ok" id="fcKnow">會了</button>
      <button class="btn" id="fcNext">下一張 →</button>
    </div>
    <div class="fc-nav">
      <button class="say" id="fcSay" aria-label="發音"></button>
      <span id="fcCount"></span>
      <button class="btn" id="fcRestart">重新開始</button>
    </div>
    <p class="kbd-hint">鍵盤：空白鍵翻面・← → 切換・↑ 會了・↓ 不熟</p>
  </section>

  <!-- 測驗 -->
  <section id="t-quiz" hidden>
    <div class="card setup" id="qSetup">
      <label>題型
        <select id="qType">
          <option value="en2zh">看英文，選中文</option>
          <option value="zh2en">看中文，選英文</option>
          <option value="spell">看中文，拼英文</option>
          <option value="listen">聽發音，拼英文</option>
        </select>
      </label>
      <label>題數
        <select id="qNum">
          <option value="10">10 題</option>
          <option value="20" selected>20 題</option>
          <option value="50">50 題</option>
          <option value="9999">範圍內全部</option>
        </select>
      </label>
      <div class="row"><button class="btn primary" id="qStart">開始測驗</button><span id="qSetupMsg" class="sub"></span></div>
    </div>
    <div class="card" id="qPlay" hidden></div>
    <div class="card" id="qEnd" hidden></div>
  </section>

  <!-- 錯題本 -->
  <section id="t-wrong" hidden>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <span class="label" id="wrongTitle">錯題本</span>
        <div class="row">
          <button class="btn" id="wCards">用字卡複習</button>
          <button class="btn primary" id="wQuiz">測驗錯題</button>
        </div>
      </div>
      <ul class="mini" id="wrongList"></ul>
      <div class="row" style="justify-content:center; margin-top:14px"><button class="btn" id="wClear">清空錯題本</button></div>
    </div>
  </section>

  <p class="foot">答錯會自動加入錯題本，之後答對會慢慢移除｜沒登入時，進度只存在這台裝置的瀏覽器</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ====== 雲端同步設定：貼上你的 Supabase 專案網址和金鑰（留空＝不使用雲端） ====== */
const SUPABASE_URL = "";   // 例如 https://abcdxyz.supabase.co
const SUPABASE_KEY = "";   // Publishable key（sb_publishable_ 開頭）或 anon public key

/* ====== 單字資料：英文|詞性|中文（依 114 年版題庫表順序） ====== */

const POS = { 名:"名詞", 動:"動詞", 形:"形容詞", 副:"副詞", 介:"介系詞", 連:"連接詞", 代:"代名詞", 限:"限定詞", 所:"所有格", 疑:"疑問詞", 副連:"副詞/連接詞" };
const WORDS = RAW.trim().split("\n").map((l, i) => {
  const [w, p, m] = l.split("|");
  return { i, n: i + 1, w: w.trim(), p: POS[p] || p, m: (m || "").trim() };
});
const TOTAL = WORDS.length;

/* ====== 工具 ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ====== 發音 ====== */
let voice = null;
const canSpeak = "speechSynthesis" in window;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Microsoft|Aria|Jenny/i.test(v.name))
       || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g, "").replace(/’/g, "'"));
  u.lang = "en-US"; if (voice) u.voice = voice; u.rate = 0.9;
  speechSynthesis.speak(u);
}

/* ====== 狀態 ====== */
let wrong = store.get("wb2000-wrong", {});   // { index: 錯誤次數 }
let known = store.get("wb2000-known", {});   // { index: 1 }
let range = store.get("wb2000-range", { from:1, to:TOTAL, onlyWrong:false, letter:"全部" });
let tab   = store.get("wb2000-tab", "list");
let localUpdated = store.get("wb2000-updated", 0);
const saveAll = (progressChanged = true) => {
  store.set("wb2000-wrong", wrong); store.set("wb2000-known", known); store.set("wb2000-range", range);
  if (progressChanged) { localUpdated = Date.now(); store.set("wb2000-updated", localUpdated); schedulePush(); }
};

function pool(){
  let a = WORDS.slice(range.from - 1, range.to);
  if (range.onlyWrong) a = a.filter(x => wrong[x.i]);
  return a;
}
function markWrong(x){ wrong[x.i] = (wrong[x.i] || 0) + 1; delete known[x.i]; saveAll(); updateStats(); }
function markRight(x){
  if (wrong[x.i]) { wrong[x.i]--; if (wrong[x.i] <= 0) delete wrong[x.i]; }
  saveAll(); updateStats();
}
function updateStats(){
  const w = Object.keys(wrong).length;
  $("stKnown").textContent = Object.keys(known).length;
  $("stWrong").textContent = w;
  $("tabWrong").textContent = w ? `(${w})` : "";
  const p = pool().length;
  $("rangeInfo").textContent = `第 ${range.from}–${range.to} 字${range.onlyWrong ? "・只看錯題" : ""}・共 ${p} 字`;
}

/* ====== 範圍 ====== */
const LETTERS = {};
WORDS.forEach(x => {
  const L = x.w[0].toUpperCase();
  if (!LETTERS[L]) LETTERS[L] = { from: x.n, to: x.n };
  LETTERS[L].to = x.n;
});
function renderLetters(){
  const keys = ["全部", ...Object.keys(LETTERS)];
  $("letters").innerHTML = keys.map(k => `<button data-l="${k}" class="${range.letter === k ? "on" : ""}">${k}</button>`).join("");
  $("rFrom").value = range.from; $("rTo").value = range.to; $("rWrong").checked = range.onlyWrong;
}
$("letters").addEventListener("click", e => {
  const k = e.target.dataset.l; if (!k) return;
  const r = k === "全部" ? { from:1, to:TOTAL } : LETTERS[k];
  range.from = r.from; range.to = r.to; range.letter = k;
  rangeChanged();
});
function onRangeInput(){
  let f = parseInt($("rFrom").value) || 1, t = parseInt($("rTo").value) || TOTAL;
  f = Math.max(1, Math.min(TOTAL, f)); t = Math.max(1, Math.min(TOTAL, t));
  if (f > t) [f, t] = [t, f];
  range.from = f; range.to = t; range.letter = (f === 1 && t === TOTAL) ? "全部" : "";
  rangeChanged();
}
$("rFrom").addEventListener("change", onRangeInput);
$("rTo").addEventListener("change", onRangeInput);
$("rWrong").addEventListener("change", () => { range.onlyWrong = $("rWrong").checked; rangeChanged(); });
function rangeChanged(){
  saveAll(false); renderLetters(); updateStats();
  listLimit = 200; renderList(); fcBuild();
  if (!$("qPlay").hidden || !$("qEnd").hidden) showQuizSetup();
}

/* ====== 分頁 ====== */
function setTab(t){
  tab = t; store.set("wb2000-tab", t);
  ["list","cards","quiz","wrong"].forEach(k => $("t-" + k).hidden = k !== t);
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  if (t === "wrong") renderWrong();
  if (t === "cards") fcRender(true);
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setTab(b.dataset.t); });

/* ====== 單字表 ====== */
let listLimit = 200;
function renderList(){
  const q = $("search").value.trim().toLowerCase();
  const a = q ? WORDS.filter(x => x.w.toLowerCase().includes(q) || x.m.includes(q)) : pool();
  $("listInfo").textContent = q ? `找到 ${a.length} 筆` : `${a.length} 字`;
  const shown = a.slice(0, listLimit);
  $("wordList").innerHTML = shown.map(x => `
    <li>
      <span class="no">${x.n}</span>
      <button class="say" data-say="${x.i}" aria-label="發音">${SPEAKER}</button>
      <span class="w">${esc(x.w)}</span>
      <span class="pos">${x.p}</span>
      <span class="m">${esc(x.m)}</span>
      <button class="star ${wrong[x.i] ? "on" : ""}" data-star="${x.i}" title="加入／移出錯題本" aria-label="錯題本">★</button>
    </li>`).join("") || `<li class="empty" style="display:block">沒有符合的單字</li>`;
  $("moreWrap").hidden = a.length <= listLimit;
}
$("search").addEventListener("input", () => { listLimit = 200; renderList(); });
$("moreBtn").onclick = () => { listLimit += 300; renderList(); };
$("wordList").addEventListener("click", e => {
  const s = e.target.closest("[data-say]"), st = e.target.closest("[data-star]");
  if (s) speak(WORDS[+s.dataset.say].w);
  if (st) {
    const x = WORDS[+st.dataset.star];
    if (wrong[x.i]) delete wrong[x.i]; else wrong[x.i] = 1;
    saveAll(); updateStats(); st.classList.toggle("on", !!wrong[x.i]);
  }
});

/* ====== 字卡 ====== */
let fc = { deck:[], pos:0, flipped:false };
$("fcShuffle").checked = store.get("wb2000-fcShuffle", false);
$("fcZh").checked = store.get("wb2000-fcZh", false);
$("fcAuto").checked = store.get("wb2000-fcAuto", true);
$("fcSay").innerHTML = SPEAKER;
function fcBuild(){
  const d = pool().slice();
  if ($("fcShuffle").checked) shuffle(d);
  fc = { deck:d, pos:0, flipped:false };
  if (tab === "cards") fcRender(true);
}
function fcRender(sayIt){
  const d = fc.deck;
  if (!d.length) {
    $("fcCard").innerHTML = `<p class="empty">${range.onlyWrong ? "錯題本是空的，或範圍內沒有錯題" : "範圍內沒有單字"}</p>`;
    $("fcCount").textContent = "0 / 0"; return;
  }
  const x = d[fc.pos], zh = $("fcZh").checked;
  const en = `<div class="big">${esc(x.w)}</div>`, cn = `<div class="big zh">${esc(x.m)}</div>`;
  $("fcCard").innerHTML = `
    <span class="fc-no">#${x.n}</span>
    <span class="badges">${known[x.i] ? '<span class="badge ok">已熟悉</span>' : ""}${wrong[x.i] ? '<span class="badge bad">錯題</span>' : ""}</span>
    ${zh ? cn : en}
    <div class="pos">${x.p}</div>
    ${fc.flipped ? `<hr>${zh ? en : cn}` : `<div class="tap">點卡片看答案</div>`}`;
  $("fcCount").textContent = `${fc.pos + 1} / ${d.length}`;
  $("fcPrev").disabled = fc.pos === 0;
  if (sayIt && $("fcAuto").checked && (!zh || fc.flipped)) speak(x.w);
}
function fcGo(step){
  if (!fc.deck.length) return;
  const n = fc.pos + step;
  if (n < 0) return;
  if (n >= fc.deck.length) {
    $("fcCard").innerHTML = `<div class="big zh">這一輪完成了！</div><div class="tap">按「重新開始」再來一次，或到測驗試試看</div>`;
    fc.pos = fc.deck.length - 1; fc.done = true; return;
  }
  fc.pos = n; fc.flipped = false; fc.done = false; fcRender(true);
}
function fcFlip(){ if (!fc.deck.length || fc.done) return; fc.flipped = !fc.flipped; fcRender(fc.flipped && $("fcZh").checked); }
$("fcCard").onclick = fcFlip;
$("fcPrev").onclick = () => fcGo(-1);
$("fcNext").onclick = () => fcGo(1);
$("fcKnow").onclick = () => { const x = fc.deck[fc.pos]; if (!x || fc.done) return; known[x.i] = 1; markRight(x); fcGo(1); };
$("fcDont").onclick = () => { const x = fc.deck[fc.pos]; if (!x || fc.done) return; markWrong(x); fcGo(1); };
$("fcSay").onclick = () => { const x = fc.deck[fc.pos]; if (x) speak(x.w); };
$("fcRestart").onclick = fcBuild;
$("fcShuffle").onchange = () => { store.set("wb2000-fcShuffle", $("fcShuffle").checked); fcBuild(); };
$("fcZh").onchange = () => { store.set("wb2000-fcZh", $("fcZh").checked); fc.flipped = false; fcRender(false); };
$("fcAuto").onchange = () => store.set("wb2000-fcAuto", $("fcAuto").checked);

/* ====== 測驗 ====== */
let qz = null;
$("qType").value = store.get("wb2000-qType", "en2zh");
$("qNum").value = store.get("wb2000-qNum", "20");
$("qType").onchange = () => store.set("wb2000-qType", $("qType").value);
$("qNum").onchange = () => store.set("wb2000-qNum", $("qNum").value);

function showQuizSetup(){ $("qSetup").hidden = false; $("qPlay").hidden = true; $("qEnd").hidden = true; qz = null; }
function qzStart(){
  const p = pool();
  if (!p.length) { $("qSetupMsg").textContent = range.onlyWrong ? "範圍內沒有錯題" : "範圍內沒有單字"; return; }
  $("qSetupMsg").textContent = "";
  const n = Math.min(+$("qNum").value, p.length);
  qz = { type: $("qType").value, items: shuffle(p.slice()).slice(0, n), k: 0, score: 0, misses: [], answered: false };
  $("qSetup").hidden = true; $("qEnd").hidden = true; $("qPlay").hidden = false;
  qzRender();
}
function distractors(x, field){
  const seen = new Set([x[field].toLowerCase()]);
  const same = shuffle(WORDS.filter(y => y.p === x.p));
  const all = shuffle(WORDS.slice());
  const out = [];
  for (const y of [...same, ...all]) {
    const v = y[field].toLowerCase();
    if (seen.has(v)) continue;
    if (field === "m" && (y.m.includes(x.m) || x.m.includes(y.m))) continue;
    seen.add(v); out.push(y);
    if (out.length === 3) break;
  }
  return out;
}
function hintOf(w){ return w.split("").map((c, i) => i === 0 ? c : (/[a-z]/i.test(c) ? "_" : c)).join(" "); }

function qzRender(){
  const x = qz.items[qz.k], t = qz.type, N = qz.items.length;
  qz.answered = false;
  let prompt = "", body = "";
  if (t === "en2zh") {
    prompt = `<div class="big">${esc(x.w)}</div><div class="pos">${x.p} <button class="say" data-qsay aria-label="發音">${SPEAKER}</button></div>`;
  } else if (t === "zh2en" || t === "spell") {
    prompt = `<div class="big zh">${esc(x.m)}</div><div class="pos">${x.p}</div>` + (t === "spell" ? `<div class="hint">${esc(hintOf(x.w))}</div>` : "");
  } else {
    prompt = `<button class="listen-btn" data-qsay aria-label="再聽一次">${SPEAKER}</button><div class="pos">${x.p}・點喇叭再聽一次</div><div class="hint">${esc(hintOf(x.w))}</div>`;
  }
  if (t === "en2zh" || t === "zh2en") {
    const field = t === "en2zh" ? "m" : "w";
    const opts = shuffle([x, ...distractors(x, field)]);
    qz.opts = opts;
    body = `<div class="choices">${opts.map((o, i) => `<button class="choice" data-c="${i}"><span class="k">${i + 1}</span><span>${esc(o[field])}</span></button>`).join("")}</div>`;
  } else {
    body = `<form class="spell" id="spellForm"><input class="inp" id="spellIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="輸入英文"><button class="btn primary">送出</button></form>`;
  }
  $("qPlay").innerHTML = `
    <div class="q-top"><span>第 ${qz.k + 1} / ${N} 題</span><span>答對 ${qz.score}</span></div>
    <div class="q-bar"><i style="width:${qz.k / N * 100}%"></i></div>
    <div class="prompt">${prompt}</div>
    ${body}
    <div class="fb" id="fb"></div>
    <div class="q-foot">
      <button class="btn" id="qQuit">結束測驗</button>
      <div class="row">
        ${t === "spell" || t === "listen" ? '<button class="btn" id="qSkip">不會</button>' : ""}
        <button class="btn primary" id="qNext" hidden>下一題 →</button>
      </div>
    </div>`;
  if (t === "en2zh" || t === "listen") speak(x.w);
  const inp = $("spellIn");
  if (inp) {
    if (matchMedia("(hover:hover)").matches || qz.k > 0) inp.focus();
    $("spellForm").onsubmit = e => {
      e.preventDefault();
      if (qz.answered) return qzNext();
      const v = inp.value.trim(); if (!v) return;
      qzAnswer(sameWord(v, x.w), v);
    };
  }
}
const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/\(.*?\)/g, "").replace(/[\s\-]+/g, "").trim();
const sameWord = (a, b) => norm(a) === norm(b);

function qzAnswer(ok, given){
  if (qz.answered) return;
  qz.answered = true;
  const x = qz.items[qz.k];
  if (ok) { qz.score++; markRight(x); } else { markWrong(x); qz.misses.push({ x, given }); }
  // 標示選項
  document.querySelectorAll(".choice").forEach((b, i) => {
    b.disabled = true;
    if (qz.opts[i] === x) b.classList.add("right");
    else if (given === i) b.classList.add("wrongc");
  });
  const inp = $("spellIn");
  if (inp) { inp.classList.add(ok ? "right" : "wrongc"); inp.readOnly = true; }
  const fb = $("fb");
  fb.className = "fb " + (ok ? "ok" : "bad");
  fb.innerHTML = ok ? `答對了！ ${esc(x.w)}・${esc(x.m)}` : `正確答案：<b>${esc(x.w)}</b>　${x.p}　${esc(x.m)}`;
  if ($("qSkip")) $("qSkip").hidden = true;
  $("qNext").hidden = false;
  if (qz.type !== "en2zh") speak(x.w);
  if (ok) qz.timer = setTimeout(qzNext, 1100);
  else $("qNext").focus();
}
function qzNext(){
  clearTimeout(qz.timer);
  if (!qz.answered) return;
  qz.k++;
  if (qz.k >= qz.items.length) return qzEnd();
  qzRender();
}
function qzEnd(){
  const N = qz.items.length, pct = Math.round(qz.score / N * 100);
  $("qPlay").hidden = true; $("qEnd").hidden = false;
  $("qEnd").innerHTML = `
    <div class="score">${qz.score} / ${N}</div>
    <div class="score-sub">正確率 ${pct}%${pct === 100 ? "・全對，太厲害了！" : pct >= 80 ? "・很不錯！" : "・錯的字已加入錯題本"}</div>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="qAgain">再測一次</button>
      ${qz.misses.length ? '<button class="btn" id="qRetry">只練這次錯的</button>' : ""}
      <button class="btn" id="qBack">變更設定</button>
    </div>
    ${qz.misses.length ? `<ul class="mini">${qz.misses.map(({ x, given }) => `
      <li><button class="say" data-say="${x.i}" aria-label="發音">${SPEAKER}</button>
      <span class="w">${esc(x.w)}</span><span class="pos">${x.p}</span><span>${esc(x.m)}</span>
      ${typeof given === "string" ? `<span class="given">${esc(given)}</span>` : ""}</li>`).join("")}</ul>` : ""}`;
}
$("qStart").onclick = qzStart;
$("t-quiz").addEventListener("click", e => {
  const c = e.target.closest(".choice");
  if (c && qz && !qz.answered) { const i = +c.dataset.c; qzAnswer(qz.opts[i] === qz.items[qz.k], i); return; }
  if (e.target.closest("[data-qsay]") && qz) { speak(qz.items[qz.k].w); return; }
  const s = e.target.closest("[data-say]"); if (s) { speak(WORDS[+s.dataset.say].w); return; }
  const id = e.target.id;
  if (id === "qNext") qzNext();
  if (id === "qSkip") qzAnswer(false, "（不會）");
  if (id === "qQuit") { if (qz && qz.k > 0) qzEnd(); else showQuizSetup(); }
  if (id === "qAgain") qzStart();
  if (id === "qBack") showQuizSetup();
  if (id === "qRetry") {
    const items = shuffle(qz.misses.map(m => m.x));
    qz = { type: qz.type, items, k: 0, score: 0, misses: [], answered: false };
    $("qEnd").hidden = true; $("qPlay").hidden = false; qzRender();
  }
});

/* ====== 錯題本 ====== */
function renderWrong(){
  const list = Object.keys(wrong).map(Number).sort((a, b) => wrong[b] - wrong[a] || a - b).map(i => WORDS[i]).filter(Boolean);
  $("wrongTitle").textContent = `錯題本（${list.length} 字）`;
  $("wCards").disabled = $("wQuiz").disabled = $("wClear").disabled = !list.length;
  $("wrongList").innerHTML = list.length ? list.map(x => `
    <li><button class="say" data-say="${x.i}" aria-label="發音">${SPEAKER}</button>
    <span class="w">${esc(x.w)}</span><span class="pos">${x.p}</span><span>${esc(x.m)}</span>
    <span class="cnt">錯 ${wrong[x.i]} 次</span>
    <button class="x" data-del="${x.i}" title="移出錯題本" aria-label="移除">×</button></li>`).join("")
    : `<li class="empty" style="display:block; border:0">目前沒有錯題。答錯的字會自動出現在這裡。</li>`;
}
$("wrongList").addEventListener("click", e => {
  const s = e.target.closest("[data-say]"), d = e.target.closest("[data-del]");
  if (s) speak(WORDS[+s.dataset.say].w);
  if (d) { delete wrong[+d.dataset.del]; saveAll(); updateStats(); renderWrong(); }
});
function useWrong(){ range = { from:1, to:TOTAL, onlyWrong:true, letter:"全部" }; rangeChanged(); }
$("wCards").onclick = () => { useWrong(); setTab("cards"); };
$("wQuiz").onclick = () => { useWrong(); setTab("quiz"); showQuizSetup(); qzStart(); };
let clearArmed = false;
$("wClear").onclick = e => {
  if (!clearArmed) {
    clearArmed = true; e.target.textContent = "再按一次確定清空";
    setTimeout(() => { clearArmed = false; e.target.textContent = "清空錯題本"; }, 3000); return;
  }
  wrong = {}; saveAll(); updateStats(); renderWrong(); rangeChanged();
  clearArmed = false; e.target.textContent = "清空錯題本";
};

/* ====== 鍵盤快捷鍵（電腦） ====== */
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (tab === "cards" && !typing) {
    if (e.key === " ") { e.preventDefault(); fcFlip(); }
    else if (e.key === "ArrowRight") fcGo(1);
    else if (e.key === "ArrowLeft") fcGo(-1);
    else if (e.key === "ArrowUp") { e.preventDefault(); $("fcKnow").click(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); $("fcDont").click(); }
  }
  if (tab === "quiz" && qz && !$("qPlay").hidden) {
    if (!qz.answered && !typing && /^[1-4]$/.test(e.key) && qz.opts && (qz.type === "en2zh" || qz.type === "zh2en")) {
      const i = +e.key - 1; if (qz.opts[i]) qzAnswer(qz.opts[i] === qz.items[qz.k], i);
    } else if (qz.answered && e.key === "Enter" && document.activeElement.id !== "spellIn") {
      e.preventDefault(); qzNext();
    }
  }
});

/* ====== 雲端同步（Supabase） ====== */
let sb = null, user = null, pushTimer = null;
function setSync(t){ $("aSync").textContent = t; }
function aMsg(t, bad){ const el = $("aMsg"); el.textContent = t || ""; el.className = "amsg" + (bad ? " bad" : ""); }
function renderAcct(){
  $("acct").hidden = !sb;
  if (!sb) return;
  $("acctOut").hidden = !!user;
  $("acctIn").hidden = !user;
  if (user) $("aWho").textContent = user.email;
}
function applyProgress(w, k){
  wrong = w || {}; known = k || {};
  store.set("wb2000-wrong", wrong); store.set("wb2000-known", known);
  updateStats(); listLimit = 200; renderList(); fcBuild();
  if (tab === "wrong") renderWrong();
}
function setLocalTime(t){ localUpdated = t; store.set("wb2000-updated", t); }

async function pull(){
  if (!sb || !user) return;
  setSync("同步中…");
  const { data, error } = await sb.from("progress").select("wrong,known,updated_at").eq("user_id", user.id).maybeSingle();
  if (error) { setSync("同步失敗：" + error.message); return; }
  const owner = store.get("wb2000-owner", null);
  const otherUser = owner && owner !== user.id;

  if (!data) {                             // 雲端還沒有資料 → 上傳本機進度
    if (otherUser) applyProgress({}, {});
    store.set("wb2000-owner", user.id);
    if (!localUpdated) setLocalTime(Date.now());
    return push();
  }
  const cloudTime = Date.parse(data.updated_at) || 0;
  if (otherUser) {                         // 這台裝置上一次是別人 → 用雲端的
    applyProgress(data.wrong, data.known); setLocalTime(cloudTime);
  } else if (!owner) {                     // 第一次在這台裝置登入 → 本機和雲端合併
    const w = { ...data.wrong }, k = { ...data.known };
    for (const i in wrong) w[i] = Math.max(w[i] || 0, wrong[i]);
    for (const i in known) k[i] = 1;
    store.set("wb2000-owner", user.id);
    applyProgress(w, k); saveAll(); return;
  } else if (cloudTime > localUpdated) {   // 別台裝置比較新
    applyProgress(data.wrong, data.known); setLocalTime(cloudTime);
  } else if (localUpdated > cloudTime) {   // 這台比較新
    return push();
  }
  store.set("wb2000-owner", user.id);
  setSync("已同步");
}
async function push(){
  if (!sb || !user) return;
  clearTimeout(pushTimer); pushTimer = null;
  setSync("同步中…");
  const { error } = await sb.from("progress").upsert({
    user_id: user.id, wrong, known, updated_at: new Date(localUpdated || Date.now()).toISOString()
  });
  if (error) setSync("同步失敗：" + error.message);
  else { setSync("已同步"); store.set("wb2000-owner", user.id); }
}
function schedulePush(){
  if (!sb || !user) return;
  setSync("等待同步…");
  clearTimeout(pushTimer); pushTimer = setTimeout(push, 1500);
}

if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((ev, session) => {
    const was = user && user.id;
    user = session ? session.user : null;
    renderAcct();
    if (user && user.id !== was) setTimeout(pull, 0);
  });
  addEventListener("online", () => { if (user) pull(); });   // 網路恢復時補同步
  document.addEventListener("visibilitychange", () => {
    if (!user) return;
    if (document.visibilityState === "visible") pull();
    else if (pushTimer) push();
  });
}
renderAcct();

const credentials = () => ({ email: $("aEmail").value.trim(), password: $("aPass").value });
$("acctToggle").onclick = () => {
  $("authForm").hidden = !$("authForm").hidden;
  if (!$("authForm").hidden) $("aEmail").focus();
};
$("authForm").onsubmit = async e => {
  e.preventDefault();
  const c = credentials();
  if (!c.email || !c.password) return aMsg("請輸入 Email 和密碼", true);
  aMsg("登入中…");
  const { error } = await sb.auth.signInWithPassword(c);
  if (error) aMsg(/Invalid login/i.test(error.message) ? "Email 或密碼錯誤"
    : /not confirmed/i.test(error.message) ? "這個帳號還沒完成 Email 確認" : "登入失敗：" + error.message, true);
  else { aMsg(""); $("aPass").value = ""; $("authForm").hidden = true; }
};
$("aSignup").onclick = async () => {
  const c = credentials();
  if (!c.email || c.password.length < 6) return aMsg("請輸入 Email 和至少 6 碼的密碼", true);
  aMsg("註冊中…");
  const { data, error } = await sb.auth.signUp({ ...c, options: { emailRedirectTo: location.origin + location.pathname } });
  if (error) return aMsg(/already registered/i.test(error.message) ? "這個 Email 已經註冊過，請直接登入" : "註冊失敗：" + error.message, true);
  if (!data.session) aMsg("註冊成功！請到信箱點確認連結，再回來登入。");
  else { aMsg("註冊成功，已自動登入！"); $("aPass").value = ""; $("authForm").hidden = true; }
};
$("aLogout").onclick = async () => {
  if (pushTimer) await push();
  await sb.auth.signOut();
  store.set("wb2000-owner", null); setLocalTime(0);
  applyProgress({}, {});
  aMsg("已登出。這台裝置上的進度已清除，雲端資料還在，下次登入會回來。");
};

/* ====== App（PWA）：離線快取與安裝 ====== */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let installEvt = null;
function showInstall(text){
  if (isStandalone || store.get("wb2000-installClosed", false)) return;
  if (text) $("installText").textContent = text;
  $("installCard").hidden = false;
}
addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); installEvt = e;
  $("installBtn").hidden = false; showInstall();
});
$("installBtn").onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice;
  installEvt = null; $("installCard").hidden = true;
};
addEventListener("appinstalled", () => { $("installCard").hidden = true; });
$("installClose").onclick = () => { $("installCard").hidden = true; store.set("wb2000-installClosed", true); };
if (isIOS && !isStandalone) showInstall("iPhone／iPad：用 Safari 開啟，點下方「分享」→「加入主畫面」，就能像 App 一樣使用");

/* ====== 啟動 ====== */
$("stTotal").textContent = TOTAL;
$("rFrom").max = $("rTo").max = TOTAL;
if (range.to > TOTAL) range.to = TOTAL;
renderLetters(); updateStats(); renderList(); fcBuild(); setTab(tab);
if (!canSpeak) document.querySelector(".sub").textContent = "114 年版題庫・共 2000 字（此瀏覽器不支援發音）";
</script>
