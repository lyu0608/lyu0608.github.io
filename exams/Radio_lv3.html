        // Ch1: 13, Ch2: 13, Ch3: 6, Ch4: 1, Ch5: 1, Ch6: 1
        const pickRandom = (cat, count) => {
            let pool = fullQuestionBank.filter(q => q.cat === cat);
            pool.sort(() => 0.5 - Math.random());
            return pool.slice(0, count);
        };

        currentQuestions = [
            ...pickRandom('ch1', 13),
            ...pickRandom('ch2', 13),
            ...pickRandom('ch3', 6),
            ...pickRandom('ch4', 1),
            ...pickRandom('ch5', 1),
            ...pickRandom('ch6', 1)
        ].sort(() => 0.5 - Math.random());

        startTimer();
    } else if (mode === 'all') {
        currentQuestions = [...fullQuestionBank];
    } else {
        currentQuestions = fullQuestionBank.filter(q => q.cat === mode);
    }

    renderPage();
    updateStats();
}

function startTimer() {
    timeLeft = 2400; // 40 mins
    const timerElem = document.getElementById('timerText');
    examTimer = setInterval(() => {
        timeLeft--;
        const min = Math.floor(timeLeft / 60);
        const sec = timeLeft % 60;
        timerElem.innerText = `⏱️ 剩餘時間：${min}分${sec < 10 ? '0' : ''}${sec}秒`;

        if (timeLeft <= 0) {
            clearInterval(examTimer);
            alert('⏱️ 考試時間到！系統自動計算成績。');
            showResult();
        }
    }, 1000);
}

function renderPage() {
    const mode = document.getElementById('modeSelect').value;
    const quizArea = document.getElementById('quizArea');
    const pageNav = document.getElementById('pageNav');
    quizArea.innerHTML = '';

    if (currentQuestions.length === 0) {
        quizArea.innerHTML = '<p style="text-align:center; padding: 20px;">尚無題目。</p>';
        pageNav.style.display = 'none';
        return;
    }

    let startIndex = 0;
    let endIndex = currentQuestions.length;

    if (mode !== 'exam') {
        pageNav.style.display = 'flex';
        startIndex = (currentPage - 1) * pageSize;
        endIndex = Math.min(startIndex + pageSize, currentQuestions.length);
        
        const totalPages = Math.ceil(currentQuestions.length / pageSize);
        document.getElementById('pageText').innerText = `(共 ${totalPages} 頁 / ${currentQuestions.length} 題)`;
        document.getElementById('jumpPageInput').max = totalPages;
        document.getElementById('jumpPageInput').value = currentPage;
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = currentPage === totalPages;
    } else {
        pageNav.style.display = 'none';
    }

    for (let index = startIndex; index < endIndex; index++) {
        const q = currentQuestions[index];
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${index}`;

        let optionsHTML = '';
        q.options.forEach((opt, optIndex) => {
            let btnClass = 'option-btn';
            let disabled = '';
            
            if (userAnswers[index] !== undefined) {
                disabled = 'disabled';
                if (optIndex === q.ans) {
                    btnClass += ' correct';
                } else if (userAnswers[index] === optIndex) {
                    btnClass += ' wrong';
                }
            }

            optionsHTML += `
                <button class="${btnClass}" id="opt-${index}-${optIndex}" ${disabled} onclick="checkAnswer(${index}, ${optIndex})">
                    (${optIndex + 1}) ${opt}
                </button>
            `;
        });

        card.innerHTML = `
            <span class="category-tag">${q.catName} - 第 ${q.num} 題</span>
            <div class="question-title">${index + 1}. ${q.q}</div>
            <div class="options">${optionsHTML}</div>
        `;
        quizArea.appendChild(card);
    }
}

function changePage(delta) {
    const totalPages = Math.ceil(currentQuestions.length / pageSize);
    currentPage += delta;
    if (currentPage < 1) currentPage = 1;
    if (currentPage > totalPages) currentPage = totalPages;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function jumpToPage() {
    const targetPage = parseInt(document.getElementById('jumpPageInput').value);
    const totalPages = Math.ceil(currentQuestions.length / pageSize);

    if (isNaN(targetPage) || targetPage < 1 || targetPage > totalPages) {
        alert(`請輸入有效的頁碼 (1 - ${totalPages})`);
        return;
    }

    currentPage = targetPage;
    renderPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function checkAnswer(qIndex, selectedOpt) {
    if (userAnswers[qIndex] !== undefined) return;

    userAnswers[qIndex] = selectedOpt;
    const q = currentQuestions[qIndex];
    const isCorrect = selectedOpt === q.ans;

    if (isCorrect) score++;

    for (let i = 0; i < q.options.length; i++) {
        const btn = document.getElementById(`opt-${qIndex}-${i}`);
        if (btn) {
            btn.disabled = true;
            if (i === q.ans) btn.classList.add('correct');
            if (i === selectedOpt && !isCorrect) btn.classList.add('wrong');
        }
    }

    updateStats();

    if (document.getElementById('modeSelect').value === 'exam' && Object.keys(userAnswers).length === currentQuestions.length) {
        clearInterval(examTimer);
        showResult();
    }
}

function updateStats() {
    const answeredCount = Object.keys(userAnswers).length;
    const total = currentQuestions.length;
    document.getElementById('progressText').innerText = `進度：${answeredCount} / ${total} 題`;
    document.getElementById('scoreText').innerText = `答對：${score} 題`;
}

function showResult() {
    const resultArea = document.getElementById('resultArea');
    const total = currentQuestions.length;
    const passScore = 25; // 25/35 to pass
    const isPass = score >= passScore;

    resultArea.style.display = 'block';
    resultArea.innerHTML = `
        <h2>🎉 測驗完成！</h2>
        <div class="score-big">${score} / ${total}</div>
        <div class="pass-tag ${isPass ? 'pass' : 'fail'}">
            ${isPass ? '✅ 及格！符合發照標準（需答對 25 題以上）' : '❌ 未及格（需答對 25 題以上，請繼續加油！）'}
        </div>
        <p style="margin-top:15px; color:#666;">可隨時選擇其他分類繼續練習！</p>
    `;

    resultArea.scrollIntoView({ behavior: 'smooth' });
}

window.onload = startQuiz;
</script>
